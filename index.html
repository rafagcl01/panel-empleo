<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Panel de búsqueda de empleo</title><style id="css">:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f6f5f2;--panel:#ffffff;--ink:#1d1d1f;--muted:#6b6b72;--line:#e3e1db;
  --accent:#4f46e5;--accent-ink:#ffffff;--soft:#eeedfc;--ok:#15803d;--warn:#b45309;--bad:#b91c1c;--blue:#2563eb;--teal:#0f766e;--purple:#7c3aed;--pink:#db2777;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#141417;--panel:#1d1d22;--ink:#ececf0;--muted:#9a9aa4;--line:#2d2d34;--accent:#8b85ff;--accent-ink:#14141a;--soft:#262540;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--blue:#60a5fa;--teal:#2dd4bf;--purple:#a78bfa;--pink:#f472b6}
}
:root[data-theme="dark"]{--bg:#141417;--panel:#1d1d22;--ink:#ececf0;--muted:#9a9aa4;--line:#2d2d34;--accent:#8b85ff;--accent-ink:#14141a;--soft:#262540;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--blue:#60a5fa;--teal:#2dd4bf;--purple:#a78bfa;--pink:#f472b6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 24px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
header h1{font-size:17px;margin:0;font-weight:650}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav button{background:none;border:0;color:var(--muted);padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit}
nav button.on{background:var(--soft);color:var(--accent);font-weight:600}
main{padding:24px;width:100%;max-width:1600px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--accent);color:var(--accent-ink);border:0;padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:90px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.muted{color:var(--muted)}
.hidden{display:none!important}
.hello{font-size:26px;margin:0 0 2px;font-weight:650}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0 22px}
@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.stat b{display:block;font-size:34px;line-height:1.1}
.stat span{color:var(--muted);font-size:14px}
.stat small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .search{flex:1 1 220px;max-width:360px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:13px;color:var(--muted)}
.chip.on{background:var(--soft);color:var(--accent);border-color:var(--accent);font-weight:600}
.lhead,.ritem{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.1fr) minmax(0,1.1fr) 110px 100px 110px 170px 40px;gap:14px;align-items:center;padding:10px 16px}
.lhead{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-top:0}
.ritem{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin-bottom:6px;cursor:pointer}
.ritem:hover{border-color:var(--accent)}
.ritem .c-main b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem .c-main span{display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem .c-city{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem select{padding:5px 8px}
.ritem a{text-decoration:none;font-size:18px;color:var(--accent)}
@media(max-width:980px){
  .lhead{display:none}
  .ritem{grid-template-columns:1fr 1fr;gap:8px 12px}
  .ritem .c-main{grid-column:1/-1}
}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--accent);font-weight:600;white-space:nowrap}
.pill.ok,.stsel.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn,.stsel.warn{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pill.bad,.stsel.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.info,.stsel.info{background:color-mix(in srgb,var(--blue) 16%,transparent);color:var(--blue)}
.pill.m-remoto{background:color-mix(in srgb,var(--teal) 16%,transparent);color:var(--teal)}
.pill.m-hibrido{background:color-mix(in srgb,var(--purple) 16%,transparent);color:var(--purple)}
.pill.m-presencial{background:color-mix(in srgb,var(--pink) 16%,transparent);color:var(--pink)}
.pill.neutral{color:var(--muted);font-weight:500}
.stsel{font-weight:600;border-color:transparent;cursor:pointer}
.stsel option{background:var(--panel);color:var(--ink);font-weight:400}
.stat.click{cursor:pointer}.stat.click:hover{border-color:var(--accent)}
.toolbar select.filt{width:auto;max-width:210px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;justify-content:center;align-items:flex-start;padding:calc(20px + env(safe-area-inset-top,0px)) 14px 20px;overflow-y:auto;z-index:20}
.modal .card{max-width:820px;width:100%}
.meter{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent)}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--soft);color:var(--accent);border-radius:99px;padding:3px 10px;margin:3px 4px 3px 0;font-size:13px}
.tag button{background:none;border:0;cursor:pointer;color:inherit;padding:0}
ul.clean{margin:6px 0;padding-left:18px}
.chat{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow-y:auto;padding:4px}
.msg{padding:10px 12px;border-radius:12px;max-width:85%;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.a{align-self:flex-start;background:var(--soft)}
.note{font-size:13px;color:var(--muted);background:var(--soft);border-radius:10px;padding:10px 12px}
pre.draft{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font-family:inherit;margin:6px 0}
.sect{margin:0 0 6px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:99px;z-index:40;font-size:14px}

.linkbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:10px 24px;background:var(--soft);font-size:13px;border-bottom:1px solid var(--line)}


.sec{margin:0 0 26px}
.sechead{display:flex;align-items:center;gap:8px;width:100%;background:none;border:0;padding:6px 2px;margin-bottom:8px;cursor:pointer;font-size:17px;font-weight:650;color:var(--ink);text-align:left}
.caret{display:inline-block;transition:transform .15s;color:var(--muted);font-size:14px}
.sec.closed .caret{transform:rotate(-90deg)}
.sec.closed .secbody{display:none}

.rrow,.rhead{grid-template-columns:minmax(0,2.2fr) 130px minmax(0,1fr) minmax(0,1fr) 110px 100px 170px}
.ritem a.olink,a.olink{font-size:14px;color:var(--accent);text-decoration:none}
a.olink:hover{text-decoration:underline}
@media(max-width:980px){.rrow{grid-template-columns:1fr 1fr}.rrow .c-main{grid-column:1/-1}}
</style></head><body><div id="root"></div><script id="data" type="application/json">{"v": 3, "rev": 1, "profile": {"name": "", "nick": "", "headline": "", "location": "", "modality": "Híbrido", "langs": [], "targetRoles": [], "skills": [], "education": "", "experience": "", "portfolio": "", "notes": ""}, "apps": [], "rules": []}</script><script id="app">"use strict";
/* ===== Constantes ===== */
const STAGES=["Preparando","Sin respuesta","Respondida","Entrevista","Prueba técnica","Oferta","Rechazada"];
const RESP=["Respondida","Entrevista","Prueba técnica","Oferta"];
const MODS=["Remoto","Híbrido","Presencial"];
const FITS=[["poco","Poco"],["medio","Medio"],["probable","Probable"]];
const $=id=>document.getElementById(id);
const HAS_CL=typeof claude!=="undefined";
const uid=()=>Math.random().toString(36).slice(2,10);
const todayISO=()=>new Date().toISOString().slice(0,10);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=iso=>iso?iso.split("-").reverse().join("/"):"—";
function ss(k,v){try{if(v===undefined)return sessionStorage.getItem(k);sessionStorage.setItem(k,v)}catch(e){return null}}

/* Los datos viven dentro del propio archivo (bloque #data) */
let S=JSON.parse($("data").textContent);
function migrateSearch(){
  const old=S.agent,base={sources:[],topN:5,extra:""};
  if(!S.search){
    S.search=base;
    if(old&&Array.isArray(old.sources))S.search.sources=old.sources.map(s=>({name:s.name,url:s.url,mode:"todas"}));
  }else S.search=Object.assign(base,S.search);
  if(!Array.isArray(S.search.sources))S.search.sources=[];
  S.search.sources.forEach(s=>{if(s.mode!=="mejores")s.mode="todas"});
  delete S.agent;
}
function normalize(){S.profile.langs=S.profile.langs||[];S.rev=S.rev||0;migrateSearch();S.apps.forEach(a=>{if(a.country===undefined)a.country=""})}
normalize();
let chat=[];try{chat=JSON.parse(ss("chat")||"[]")}catch(e){}
let filt=Object.assign({q:"",st:"all",mod:"all",fit:"all",country:"all",city:"all"},(()=>{try{return JSON.parse(ss("filt")||"{}")}catch(e){return{}}})());
function saveFilt(){ss("filt",JSON.stringify(filt))}
let busy=false;

/* ===== Guardado: se reescribe el archivo con los datos dentro ===== */
let pubTimer=null,pending=false;
function setSave(t,retry){
  const e=$("saveState");if(!e)return;
  e.textContent=t;
  if(retry){const b=document.createElement("button");b.className="btn sec sm";b.style.marginLeft="8px";b.textContent="Reintentar";b.onclick=()=>doPublish();e.appendChild(b)}
}
function buildDoc(){
  const CL="<"+"/";
  const css=$("css").textContent, code=$("app").textContent;
  const data=JSON.stringify(S).replace(/</g,"\\u003c");
  return "<!DOCTYPE html>\n<html lang=\"es\"><head><meta charset=\"utf-8\">"
   +"<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">"
   +"<title>Panel de búsqueda de empleo</title><style id=\"css\">"+css+CL+"style></head><body>"
   +"<div id=\"root\">"+CL+"div>"
   +"<script id=\"data\" type=\"application/json\">"+data+CL+"script>"
   +"<script id=\"app\">"+code+CL+"script></body></html>";
}
async function dbRef(){
  if(!HAS_CL)return null;
  try{
    const user=await claude.use("user"),db=await claude.use("db");
    if(!user||!db)return null;
    const id=await user.id();
    if(!id)return null;
    return db.collection("data/users/"+id).doc("panel");
  }catch(e){return null}
}
function save(){
  S.rev=(S.rev||0)+1;
  pending=true;setSave("Guardando…");
  clearTimeout(pubTimer);pubTimer=setTimeout(doPublish,200);
}
async function doPublish(){
  setSave("Guardando…");
  if(!HAS_CL){await localSave();return}
  let dbOk=false,dbErr="";
  try{
    const ref=await dbRef();
    if(ref){await ref.set({json:JSON.stringify(S)});dbOk=true}else dbErr="no disponible";
  }catch(e){dbErr=((e&&e.code)||"error")+(e&&e.message?": "+e.message:"")}
  let fileOk=false,fileErr="";
  try{
    const art=await claude.use("artifact");
    if(!art)fileErr="sin acceso de escritura";
    else{await art.publish(buildDoc());fileOk=true}
  }catch(e){
    if(e&&e.code==="conflict"){setSave("Se guardó antes desde otra ventana; recargando…");return}
    fileErr=((e&&e.code)||"error")+(e&&e.message?": "+e.message:"");
  }
  if(fileOk){pending=false;setSave("Guardado en el archivo ✓")}
  else if(dbOk){pending=false;setSave("Guardado en la base de datos del panel ✓ (el archivo no se pudo escribir: "+fileErr+")")}
  else setSave("No se pudo guardar. Archivo: "+fileErr+(dbErr?" · Base de datos: "+dbErr:""),true);
}
async function loadDb(){
  try{
    const ref=await dbRef();if(!ref)return;
    const snap=await ref.get();
    if(!snap.exists)return;
    const r=JSON.parse(snap.data().json);
    if((r.rev||0)>(S.rev||0)){S=r;normalize();render();setSave("Cargado desde la base de datos del panel")}
  }catch(e){}
}
window.addEventListener("beforeunload",e=>{if(pending){e.preventDefault();e.returnValue=""}});
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function dlBlob(name,text){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:"application/json"}));
  a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
async function exportData(){
  if(!HAS_CL){dlBlob("panel-empleo-copia.json",JSON.stringify(S,null,2));return}
  try{
    const dl=await claude.use("downloads");
    if(!dl){toast("Descarga no disponible aquí");return}
    await dl.save({filename:"panel-empleo-copia.json",data:JSON.stringify(S,null,2)});
  }catch(e){if(!e||e.code!=="declined")toast("No se pudo exportar")}
}

/* ===== Guardado: copia en el navegador + GitHub ===== */
const LS="panel-empleo-datos",DATA_NAME="panel-empleo-datos.json";
async function localSave(){
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  if(ghOn()){
    markDirty();
    try{await ghFlush();pending=false;setSave("Guardado en GitHub ✓")}
    catch(e){pending=true;setSave("No se pudo guardar en GitHub: "+((e&&e.message)||"error")+" (los datos siguen en este navegador)",true)}
  }else{
    pending=false;
    setSave("Guardado solo en este navegador. Conecta GitHub en Agente IA para tener copia en la nube.");
  }
}
async function initLocal(){
  if(HAS_CL)return;
  try{const r=JSON.parse(localStorage.getItem(LS)||"null");if(r&&r.apps&&(r.rev||0)>(S.rev||0)){S=r;normalize();render()}}catch(e){}
  renderLinkBar();
  if(ghOn())ghSync(false);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&ghOn()&&!pending)ghSync(false)});
}
function importPick(){
  const i=document.createElement("input");i.type="file";i.accept=".json,application/json";
  i.onchange=async()=>{
    try{
      const r=JSON.parse(await i.files[0].text());
      if(!r||!r.apps||!r.profile)throw 0;
      if(!confirm("Se reemplazarán los datos actuales por los del archivo. ¿Continuar?"))return;
      S=r;normalize();render();save();toast("Datos importados");
    }catch(e){toast("No es un archivo de datos válido")}
  };
  i.click();
}
function renderLinkBar(){
  const el=$("linkBar");
  if(el){
    if(HAS_CL||ghOn()){el.className="hidden";el.innerHTML=""}
    else{
      el.className="linkbar";
      el.innerHTML='<span>Aún no has conectado GitHub: lo que hagas solo se guarda en este navegador.</span><button class="btn sm" id="lbCfg">Conectar GitHub</button>';
      $("lbCfg").onclick=()=>{showTab("agent");const c=$("ghCard");if(c)c.scrollIntoView({behavior:"smooth"})};
    }
  }
  renderGhCard();
}
function backupHtml(){
  return '<div class="row" style="margin-top:12px"><span class="muted" style="font-size:13px">Copia de seguridad:</span><button class="btn sec sm" id="scExp">Exportar copia</button><button class="btn sec sm" id="scImp">Importar copia</button></div>';
}
/* ===== Sincronización con GitHub (repositorio privado de datos) ===== */
const GH_KEY="panel-empleo-gh",DIRTY_KEY="panel-empleo-dirty";
let gh=null;try{gh=JSON.parse(localStorage.getItem(GH_KEY)||"null")}catch(e){}
let ghBusy=false;
const ghOn=()=>!HAS_CL&&!!(gh&&gh.owner&&gh.repo&&gh.token);
function ghSaveCfg(){try{localStorage.setItem(GH_KEY,JSON.stringify(gh))}catch(e){}}
function markDirty(){try{localStorage.setItem(DIRTY_KEY,"1")}catch(e){}}
function clearDirty(){try{localStorage.removeItem(DIRTY_KEY)}catch(e){}}
function isDirty(){try{return localStorage.getItem(DIRTY_KEY)==="1"}catch(e){return false}}
function b64enc(s){return btoa(unescape(encodeURIComponent(s)))}
function b64dec(s){return decodeURIComponent(escape(atob(s.replace(/\s/g,""))))}
function ghBase(){return "https://api.github.com/repos/"+encodeURIComponent(gh.owner)+"/"+encodeURIComponent(gh.repo)}
function ghHeaders(json){
  const h={"Accept":"application/vnd.github+json","Authorization":"Bearer "+gh.token,"X-GitHub-Api-Version":"2022-11-28"};
  if(json)h["Content-Type"]="application/json";
  return h;
}
async function ghFetch(method,body,bust){
  const url=ghBase()+"/contents/"+gh.path.split("/").map(encodeURIComponent).join("/")+(bust?"?t="+Date.now():"");
  try{return await fetch(url,{method:method,cache:"no-store",headers:ghHeaders(!!body),body:body?JSON.stringify(body):undefined})}
  catch(e){throw new Error("sin conexión con GitHub")}
}
async function ghFail(r){
  let m="";try{m=(await r.json()).message||""}catch(e){}
  if(r.status===401)return new Error("el token no es válido o ha caducado");
  if(r.status===403)return new Error("sin permiso para esa acción o límite alcanzado"+(m?" ("+m+")":""));
  if(r.status===404)return new Error("no se encuentra el repositorio: revisa usuario y nombre, y que el token tenga acceso a él");
  return new Error("error "+r.status+(m?": "+m:""));
}
async function ghGet(){
  const r=await ghFetch("GET",null,true);
  if(r.status===404){
    let rr;
    try{rr=await fetch(ghBase(),{cache:"no-store",headers:ghHeaders(false)})}catch(e){throw new Error("sin conexión con GitHub")}
    if(rr.ok)return{missing:true};
    throw await ghFail(rr);
  }
  if(!r.ok)throw await ghFail(r);
  const j=await r.json();
  let d;
  try{d=JSON.parse(b64dec(j.content||""))}catch(e){throw new Error("el archivo de datos de GitHub no tiene un formato válido")}
  if(!d||!d.apps||!d.profile)throw new Error("el archivo de datos de GitHub no tiene un formato válido");
  return{data:d,sha:j.sha};
}
function adopt(d){
  S=d;normalize();
  try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
  render();
}
async function ghConflict(cur){
  if(confirm("Los datos de GitHub son distintos de los de este dispositivo (quizá se editaron desde otro).\n\nAceptar = usar los de GitHub (se descartan los cambios de aquí que no estén subidos).\nCancelar = subir los de este dispositivo y sobrescribir GitHub.")){
    adopt(cur.data);gh.sha=cur.sha;ghSaveCfg();clearDirty();setSave("Datos cargados desde GitHub ✓");
  }else{gh.sha=cur.sha;await ghPush()}
}
async function ghPush(){
  const body={message:"Panel de empleo: "+new Date().toISOString().slice(0,16).replace("T"," "),content:b64enc(JSON.stringify(S,null,2))};
  if(gh.sha)body.sha=gh.sha;
  let r=await ghFetch("PUT",body);
  if(r.status===409||r.status===422){
    const cur=await ghGet();
    if(cur.missing){delete body.sha;r=await ghFetch("PUT",body)}
    else if(cur.sha!==gh.sha){await ghConflict(cur);return}
    else throw await ghFail(r);
  }
  if(!r.ok)throw await ghFail(r);
  const j=await r.json();
  gh.sha=j.content.sha;gh.last=Date.now();ghSaveCfg();clearDirty();
}
async function ghFlush(){
  while(ghBusy)await new Promise(res=>setTimeout(res,120));
  ghBusy=true;
  try{await ghPush()}finally{ghBusy=false}
}
async function ghSync(manual){
  if(!ghOn()||ghBusy)return;
  ghBusy=true;
  try{
    setSave("Sincronizando con GitHub…");
    const r=await ghGet();
    if(r.missing){await ghPush();setSave("Archivo de datos creado en GitHub ✓")}
    else if(r.sha===gh.sha){
      if(isDirty()){await ghPush();setSave("Cambios subidos a GitHub ✓")}else setSave("GitHub al día ✓");
    }else{
      const same=JSON.stringify([r.data.apps,r.data.profile,r.data.rules])===JSON.stringify([S.apps,S.profile,S.rules]);

    }

}

  L.push("- country: nombre del país en español.");
  L.push('- modality: solo "Remoto", "Híbrido" o "Presencial" (o "" si no lo sabes).');
  L.push('- fit: "medio" o "probable", según lo bien que encaja con mi perfil.');

  return `<span class="pill ${f==="probable"?"ok":f==="medio"?"warn":"bad"}">${x[1]}</span>`;

const KW=["zbrush","maya","3ds max","blender","marvelous","substance","rizom","topogun","xgen","marmoset","photoshop","unreal","unity","houdini","speedtree","retopolog","grooming","hair","cloth","tela","sculpt","escultura","texturi","pbr","aaa","rigging","animation","animación","lod","bake","stylized","realistic","realista","character","personaje","environment","entorno","props","hard surface","nanite","metahuman","perforce","git"];
function quickScore(desc){
  const d=desc.toLowerCase(),sk=S.profile.skills.map(s=>s.toLowerCase());
  const found=KW.filter(k=>d.includes(k));
  if(!found.length)return null;
  const mine=found.filter(k=>sk.some(s=>s.includes(k)||k.includes(s)));
  return Math.round(25+75*(mine.length/found.length)*Math.min(1,found.length/6+0.4));
}

  };
}

function passFilter(a){
  if(filt.st==="__resp"){if(!RESP.includes(a.stage))return false}
  else if(filt.st!=="all"&&a.stage!==filt.st)return false;
  if(filt.mod!=="all"&&(filt.mod==="__none"?a.modality:a.modality!==filt.mod))return false;
  if(filt.fit!=="all"&&(filt.fit==="__none"?a.fit:a.fit!==filt.fit))return false;
  if(filt.country!=="all"&&(filt.country==="__none"?a.country:a.country!==filt.country))return false;
  if(filt.city!=="all"&&(filt.city==="__none"?a.city:a.city!==filt.city))return false;
  const q=filt.q.trim().toLowerCase();
  if(q&&!(a.company+" "+a.role+" "+a.city+" "+a.country).toLowerCase().includes(q))return false;
  return true;
}

const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();
function isIntern(a){
  if(a.kind==="practicas")return true;
  if(a.kind==="no")return false;
  return /\b(interns?|internship|trainee|apprentice|becari[oa]s?|beca)\b|pr[aá]cticas/i.test(a.role||"");
}
function radarGroup(a){
  if(isIntern(a))return "practicas";
  if(norm(a.country)==="espana"||a.modality==="Remoto")return "esp";
  if(a.country&&(a.modality==="Presencial"||a.modality==="Híbrido"))return "fuera";
  return "otros";
}
const RGROUPS=[["practicas","Prácticas","Ofertas de prácticas, estén donde estén."],["esp","En España o en remoto","Ofertas en España (con cualquier modalidad) o remotas en cualquier país."],["fuera","Presencial o híbrido fuera de España","Ofertas presenciales o híbridas en otros países."],["otros","Sin clasificar","Falta el país o la modalidad para saber dónde van."]];

/* ===== Importar ofertas (sin borrar lo existente) ===== */
function importOffers(text){
  const t=text.trim().replace(/^```(?:json)?\s*/i,"").replace(/\s*```$/,"");
  let data=JSON.parse(t);
  if(!Array.isArray(data))data=data.ofertas||data.offers||[];
  const keyU=u=>String(u||"").trim().toLowerCase().replace(/^https?:\/\/(www\.)?/,"").replace(/[?#].*$/,"").replace(/\/+$/,"");
  const keyR=a=>norm(a.company)+"|"+norm(a.role)+"|"+norm(a.country);
  let added=0,dup=0,bad=0;
  data.forEach(o=>{
    if(!o||(!o.company&&!o.role)){bad++;return}
    const a={id:uid(),company:String(o.company||"").trim(),role:String(o.role||"").trim(),city:String(o.city||"").trim(),country:String(o.country||"").trim(),
      modality:MODS.includes(o.modality)?o.modality:"",date:/^\d{4}-\d{2}-\d{2}$/.test(o.date||"")?o.date:todayISO(),
      fit:["poco","medio","probable"].includes(o.fit)?o.fit:"",stage:"Preparando",url:String(o.url||"").trim(),email:"",notes:String(o.notes||""),desc:"",
      match:null,analysis:null,radar:true,kind:["practicas","no"].includes(o.kind)?o.kind:"",events:[{d:todayISO(),t:"Importada de una búsqueda con Claude"}]};
    const dupe=S.apps.some(x=>(a.url&&x.url&&keyU(a.url)===keyU(x.url))||keyR(x)===keyR(a));
    if(dupe){dup++;return}
    S.apps.push(a);added++;
  });
  return{added:added,dup:dup,bad:bad};
}
function openImport(){
  $("modalRoot").innerHTML=`<div class="modal"><div class="card">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0;font-size:18px">Importar ofertas</h2><button class="btn sec sm" id="impX">Cerrar</button></div>
    <p class="muted" style="margin-top:6px">Pega aquí las ofertas que te haya preparado Claude (formato JSON) o elige el archivo. Se añaden al radar sin borrar nada, y se omiten las que ya tengas.</p>
    <textarea id="impText" style="min-height:200px" placeholder='[{"company":"…","role":"…","url":"…","country":"…","city":"…","modality":"Remoto","fit":"medio","kind":"practicas","notes":"…"}]'></textarea>
    <div class="row" style="margin-top:10px"><input type="file" id="impFile" accept=".json,application/json" style="max-width:320px"><button class="btn" id="impGo">Importar</button></div>
    <div id="impOut" style="margin-top:12px"></div>
  </div></div>`;
  $("impX").onclick=closeModal;
  $("impFile").onchange=async e=>{const f=e.target.files[0];if(f)$("impText").value=await f.text()};
  $("impGo").onclick=()=>{
    const txt=$("impText").value;
    if(!txt.trim()){toast("Pega las ofertas o elige un archivo");return}
    try{
      const r=importOffers(txt);
      if(r.added){save();render()}
      $("impOut").innerHTML='<div class="note">'+r.added+' oferta'+(r.added===1?"":"s")+' añadida'+(r.added===1?"":"s")+' al radar'+(r.dup?' · '+r.dup+' omitida'+(r.dup===1?"":"s")+' por estar ya en tu panel':"")+(r.bad?' · '+r.bad+' sin datos suficientes':"")+'.'+(r.added?' Pulsa Guardar si ves un aviso de guardado pendiente.':'')+'</div>';
    }catch(e){$("impOut").innerHTML='<div class="note">No he podido leer el formato. Asegúrate de pegar el contenido completo tal como te lo di.</div>'}
  };
}

        <div><label>Correo de contacto</label><input id="f-email" value="${esc(d.email)}"></div>

    <label>Roles objetivo</label><div>${chips(p.targetRoles,"targetRoles")}</div>
    <div class="row" style="margin-top:6px"><input id="addRole" placeholder="Añadir rol" style="max-width:260px"><button class="btn sec sm" data-add="targetRoles" data-src="addRole">Añadir</button></div>
    <label>Skills y software</label><div>${chips(p.skills,"skills")}</div>
    <div class="row" style="margin-top:6px"><input id="addSkill" placeholder="Añadir skill" style="max-width:260px"><button class="btn sec sm" data-add="skills" data-src="addSkill">Añadir</button></div>
    <label>Idiomas</label><div>${chips(p.langs,"langs")}</div>
    <div class="row" style="margin-top:6px"><input id="addLang" placeholder="Añadir idioma" style="max-width:260px"><button class="btn sec sm" data-add="langs" data-src="addLang">Añadir</button></div>
    <label>Formación</label><textarea data-f="education">${esc(p.education)}</textarea>
    <label>Experiencia</label><textarea data-f="experience">${esc(p.experience)}</textarea>
    <label>Notas para el agente (preferencias, sueldo objetivo, lo que evitar…)</label><textarea data-f="notes">${esc(p.notes)}</textarea>
  </div>`;
  const el=$("t-profile");
  el.querySelectorAll("[data-f]").forEach(i=>i.addEventListener("input",()=>{S.profile[i.dataset.f]=i.value}));
  el.querySelectorAll(".tag button").forEach(b=>b.onclick=()=>{S.profile[b.dataset.k].splice(+b.dataset.i,1);renderProfile()});
  el.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{
    const v=$(b.dataset.src).value.trim();if(!v)return;
    S.profile[b.dataset.add].push(v);renderProfile();
  });
  $("saveProfile").onclick=()=>{save();renderBoard();toast("Guardando perfil…")};
}

/* ===== Agente ===== */
function renderAgent(){
  $("t-agent").innerHTML=`<div style="display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start" id="agentGrid">
    <div class="card">
      <h2 style="margin:0 0 4px;font-size:20px">Agente IA</h2>
      <p class="muted" style="margin-top:0">Habla con él para cambiar cómo analiza ofertas o redacta mensajes. Ej.: “Prioriza estudios con trabajo híbrido en Madrid”, “escribe los mensajes más breves”.</p>
      <div class="chat" id="chatBox">${chat.length?chat.map(m=>`<div class="msg ${m.r==="u"?"u":"a"}">${esc(m.t)}</div>`).join(""):'<div class="muted">Aún no hay conversación.</div>'}</div>
      <div class="row" style="margin-top:12px;flex-wrap:nowrap"><input id="chatIn" placeholder="Escribe al agente…"><button class="btn" id="chatSend">Enviar</button></div>
    </div>
    <div class="card">
      <h3 class="sect">Reglas activas del agente</h3>
      <p class="muted" style="font-size:13px;margin-top:0">Se aplican en cada análisis y mensaje. Cuando le pidas un cambio de comportamiento estable, se añadirá aquí.</p>
      ${S.rules.length?`<ul class="clean">${S.rules.map((r,i)=>`<li>${esc(r)} <button class="btn sec sm" data-rm="${i}">×</button></li>`).join("")}</ul>`:'<p class="muted">Sin reglas todavía.</p>'}
      <div class="row" style="margin-top:8px"><input id="ruleIn" placeholder="Añadir regla a mano"><button class="btn sec sm" id="ruleAdd">Añadir</button></div>
    </div>
  </div>
  <div class="card" id="searchCard" style="margin-top:16px"></div>
  <div class="card" id="ghCard" style="margin-top:16px"></div>`;
  if(window.innerWidth<800)$("agentGrid").style.gridTemplateColumns="1fr";
  const box=$("chatBox");box.scrollTop=box.scrollHeight;
  renderSearchCard();
  renderGhCard();
  $("chatSend").onclick=sendChat;
  $("chatIn").addEventListener("keydown",e=>{if(e.key==="Enter")sendChat()});
  $("t-agent").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{S.rules.splice(+b.dataset.rm,1);save();renderAgent()});
  $("ruleAdd").onclick=()=>{const v=$("ruleIn").value.trim();if(!v)return;S.rules.push(v);save();renderAgent()};
}
async function sendChat(){
  if(busy)return;
  const inp=$("chatIn"),text=inp.value.trim();
  if(!text)return;
  busy=true;chat.push({r:"u",t:text});ss("chat",JSON.stringify(chat.slice(-30)));
  renderAgent();
  const b2=$("chatBox");
  b2.insertAdjacentHTML("beforeend",'<div class="msg a">Pensando…</div>');b2.scrollTop=b2.scrollHeight;
  let newRule=false;
  try{
    const sample=await getSample();
    if(!sample)throw {code:"unavailable"};
    let turns=chat.slice(-12).map(m=>({role:m.r==="u"?"user":"assistant",content:m.t}));
    while(turns.length&&turns[0].role!=="user")turns.shift();
    const c=counts();
    const instruction=`[Instrucciones para ti: eres el agente de búsqueda de empleo de un artista 3D de videojuegos, dentro de su panel personal. No puedes navegar por internet desde aquí. Puedes explicar cómo trabajas, aconsejar sobre candidaturas y cambiar tu comportamiento si el usuario lo pide. Responde en español, breve y útil.
PERFIL:\n${profileText()}\n${rulesText()}\nPÁGINAS DE BÚSQUEDA: ${agentText()}\nRESUMEN: ${c.sent} candidaturas enviadas, ${c.resp} respondidas, ${c.wait} sin contestar, ${c.rej} rechazadas.
Responde SOLO con JSON: {"reply":"tu respuesta","new_rules":["regla nueva si el usuario ha pedido un cambio estable de comportamiento; si no, lista vacía"]}]\n\n`;
    turns[0]={role:"user",content:instruction+turns[0].content};
    const r=await sample.json(turns,{modelTier:"default",cache:false});
    chat.push({r:"a",t:String(r.reply||"…")});
    (r.new_rules||[]).forEach(n=>{if(n&&!S.rules.includes(n)){S.rules.push(n);newRule=true}});
  }catch(e){
    chat.push({r:"a",t:e&&e.code==="no_runtime"?"La IA solo funciona abriendo el panel desde el enlace publicado en Claude, no desde un archivo descargado.":e&&e.code==="not_granted"?"Necesito que permitas usar Claude desde esta página para poder responder.":"No he podido responder ahora mismo. Inténtalo de nuevo en un momento."});
  }
  ss("chat",JSON.stringify(chat.slice(-30)));
  busy=false;renderAgent();
  if(newRule)save();
}

init();
loadDb();
initLocal();
</script></body></html>

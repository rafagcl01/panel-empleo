<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Panel de búsqueda de empleo</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap" rel="stylesheet"><style id="css">
/* ===== Colores (tokens). Oscuro por defecto; data-theme="light" activa el claro ===== */
:root{
  color-scheme:dark;
  --bg:#0b0a0f;--panel:#131218;--raise:#1c1b22;--field:#0f0e14;--hover:rgba(255,255,255,.045);
  --ink:#ececf1;--muted:#9c9ba8;--line:rgba(255,255,255,.075);--line2:rgba(255,255,255,.13);
  --accent:#ff6363;--accent-ink:#1d0a0c;--accent-text:#ff8a8a;--violet:#a78bfa;
  --soft:rgba(255,99,99,.11);--sel:rgba(255,255,255,.06);
  --ok:#4ade80;--warn:#fbbf24;--bad:#fb7185;--blue:#7cb4ff;--teal:#2dd4bf;--purple:#c4b5fd;--pink:#f9a8d4;
  --glow1:rgba(255,99,99,.28);--glow2:rgba(150,92,255,.26);
  --shadow:0 18px 50px -18px rgba(0,0,0,.75);--shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --tile-l:72%;--tile-a:.16;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#f5f4f8;--panel:#ffffff;--raise:#efeef4;--field:#fbfbfd;--hover:rgba(30,15,60,.04);
  --ink:#18171d;--muted:#5d5c69;--line:rgba(30,15,60,.09);--line2:rgba(30,15,60,.16);
  /* Coral salmón con letra oscura: en claro, el rojo puro parecía "borrar" */
  --accent:#ff7a6b;--accent-ink:#2a0d0a;--accent-text:#b23a2e;--violet:#7c3aed;
  --soft:rgba(255,122,107,.15);--sel:rgba(30,15,60,.055);
  /* Tonos de estado un paso más oscuros: sobre su propio fondo tintado deben pasar 4.5:1 */
  --ok:#166534;--warn:#92400e;--bad:#be123c;--blue:#1d4ed8;--teal:#115e59;--purple:#6d28d9;--pink:#be185d;
  --glow1:rgba(255,99,99,.14);--glow2:rgba(150,92,255,.13);
  --shadow:0 18px 50px -20px rgba(30,15,60,.28);--shadow-sm:0 1px 2px rgba(30,15,60,.08);
  --tile-l:38%;--tile-a:.13;
}

/* ===== Base ===== */
html{scroll-padding-top:calc(70px + env(safe-area-inset-top,0px))}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01";caret-color:var(--accent);min-height:100vh}
/* El brillo coral-violeta detrás de la parte superior */
body::before{content:"";position:absolute;left:0;right:0;top:60px;height:520px;pointer-events:none;z-index:0;
  background:radial-gradient(45% 70% at 24% 18%,var(--glow1),transparent 72%),radial-gradient(42% 70% at 74% 8%,var(--glow2),transparent 72%)}
::selection{background:color-mix(in srgb,var(--accent) 35%,transparent)}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent-text);text-underline-offset:3px}
.ic{display:inline-block;vertical-align:-3px;flex:none}

/* ===== Barra superior ===== */
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 24px;border-bottom:1px solid var(--line);
  background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);
  position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,var(--accent) 0%,var(--violet) 100%);box-shadow:0 0 0 1px rgba(255,255,255,.12) inset}
header h1{font-size:14.5px;margin:0;font-weight:600;letter-spacing:-.01em}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--muted);padding:6px 11px;border-radius:8px;cursor:pointer;font:inherit;font-weight:500;transition:background .15s,color .15s}
nav button:hover{color:var(--ink);background:var(--hover)}
nav button.on{background:var(--raise);color:var(--ink);box-shadow:0 0 0 1px var(--line) inset}
.status{font-size:12px;color:var(--muted);margin-left:auto;max-width:380px;text-align:right}
.status:empty{display:none}
.status:not(:empty)+.topsearch{margin-left:0}
.topsearch{display:flex;align-items:center;gap:8px;margin-left:auto;background:var(--field);border:1px solid var(--line2);color:var(--muted);border-radius:9px;padding:5px 6px 5px 10px;min-width:210px;cursor:pointer;font:inherit;transition:border-color .15s}
.topsearch:hover{border-color:color-mix(in srgb,var(--accent) 50%,var(--line2));color:var(--ink)}
.topsearch span{flex:1;text-align:left}
.iconbtn{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;border:1px solid var(--line2);background:var(--field);color:var(--muted);cursor:pointer}
.iconbtn:hover{color:var(--ink)}
kbd{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 5px;border-radius:5px;background:var(--raise);border:1px solid var(--line2);box-shadow:0 1px 0 var(--line2);color:var(--muted);font:500 11px/1 var(--font);margin-right:3px}
main{padding:28px 24px 48px;width:100%;max-width:1180px;margin:0 auto;position:relative;z-index:1}

/* ===== Controles ===== */
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--accent);color:var(--accent-ink);border:1px solid transparent;padding:7px 13px;border-radius:8px;cursor:pointer;font-weight:600;transition:filter .15s,background .15s,border-color .15s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:var(--raise);color:var(--ink);border-color:var(--line2);font-weight:500}
.btn.sec:hover{filter:none;border-color:color-mix(in srgb,var(--ink) 30%,transparent)}
.btn.sm{padding:4px 9px;font-size:12.5px;border-radius:7px}
/* Acción que borra: discreta hasta que pasas el ratón */
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);font-weight:500}
.btn.ghost:hover{filter:none;color:var(--bad);background:var(--hover)}
.btn:disabled{opacity:.5;cursor:default;filter:none}
input,select,textarea{background:var(--field);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%;min-width:0;transition:border-color .15s,box-shadow .15s}
input::placeholder,textarea::placeholder{color:var(--muted)}
input:focus,select:focus,textarea:focus{outline:none;border-color:color-mix(in srgb,var(--accent) 70%,transparent);box-shadow:0 0 0 3px var(--soft)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn.danger{background:transparent;border-color:color-mix(in srgb,var(--bad) 55%,transparent);color:var(--bad)}
.btn.danger:hover{filter:none;background:color-mix(in srgb,var(--bad) 10%,transparent)}
textarea{resize:vertical;min-height:90px}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px;font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow-sm)}
.muted{color:var(--muted)}
.hidden{display:none!important}
.hello{font-size:28px;margin:0 0 4px;font-weight:600;letter-spacing:-.022em;line-height:1.15}
.ptitle{font-size:24px;margin:0 0 4px;font-weight:650;letter-spacing:-.02em;line-height:1.2}

/* Resumen de candidaturas: un selector segmentado que también filtra */
.stats{display:inline-flex;flex-wrap:wrap;margin:12px 0 20px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.stat{display:flex;align-items:baseline;gap:7px;padding:6px 12px;border-radius:7px;transition:background .15s,color .15s;color:var(--muted)}
.stat b{font-size:14px;font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;font-weight:500}
.stat small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
button.stat{border:0;background:transparent;font:inherit;text-align:left}
.stat.click{cursor:pointer}.stat.click:hover{background:var(--hover);color:var(--ink)}
.stat.on{background:var(--soft);color:var(--accent-text)}
.stat.on b{color:var(--accent-text)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar .search{flex:1 1 240px;max-width:none} /* buscador, Filtros y contador en una sola fila */
.toolbar select.filt{width:auto;max-width:220px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:5px 11px;cursor:pointer;font-size:13px;color:var(--muted);font-weight:500;transition:color .15s,border-color .15s,background .15s}
.chip:hover{color:var(--ink)}
.chip.on{background:var(--soft);color:var(--accent-text);border-color:color-mix(in srgb,var(--accent) 45%,transparent)}

/* ===== Listas (candidaturas y radar) ===== */
/* Candidaturas: nombre | lugar | modalidad | fecha | encaje | estado | enlace */
.lhead,.ritem{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1.4fr) 100px 100px 100px 170px 40px;gap:14px;align-items:center;padding:10px 16px}
.lhead{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500;padding-top:0;padding-bottom:8px}
#rows,#inprogRows,#rList{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ritem{border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
.ritem:last-child{border-bottom:0}
.ritem:hover{background:var(--hover)}
.ritem .c-main{display:flex;align-items:center;gap:12px;min-width:0}
.ritem .c-main>div{min-width:0}
.ritem .c-main b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ritem .c-main span:not(.pill):not(.tile){display:block;color:var(--muted);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ritem .c-city{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.ritem .c-date{font-variant-numeric:tabular-nums;color:var(--muted)}
.ritem select{padding:5px 8px}
.ritem .c-link a{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;color:var(--muted)}
.rrow:hover .c-link a,.rrow:focus-within .c-link a{color:var(--accent-text)}
.ritem:focus-visible{outline-offset:-2px}
.ritem .c-link a:hover{background:var(--raise);color:var(--accent-text)}
@media(max-width:980px){
  .lhead{display:none}
  .ritem{grid-template-columns:1fr 1fr;gap:8px 12px}
  .ritem .c-main{grid-column:1/-1}
}
/* Radar: nombre | encaje | lugar | modalidad | fecha | acciones (enlace + decidir) */
.rrow,.rhead{grid-template-columns:minmax(0,2.4fr) 100px minmax(0,1.3fr) 100px 90px 240px}
/* Páginas donde buscar (Agente IA): tabla compacta */
.srow,.shead{display:grid;grid-template-columns:minmax(120px,1.2fr) minmax(0,2.5fr) 245px 96px;gap:12px;align-items:center}
.srow{padding:8px 12px;background:var(--field);border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.shead{padding:0 13px 6px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.arow{background:transparent;border-color:transparent;padding-left:0;padding-right:0}
.srow .s-name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .s-url{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow select,.srow input{width:100%}
.srow .btn{width:100%;justify-content:center}
.srow .s-del{justify-self:end;width:40px;padding:4px}
@media(max-width:760px){.srow,.shead{grid-template-columns:1fr 1fr 96px}.shead{display:none}.srow .s-name,.srow .s-url{grid-column:1/-1}.arow input{grid-column:1/-1}}
.c-place{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-stage{display:flex;align-items:center;gap:6px;justify-content:flex-end}
.newdot{flex:none;width:7px;height:7px;border-radius:50%;background:var(--violet)}
.ritem .c-name{display:flex;align-items:center;gap:6px;min-width:0}
.ritem .c-name b{min-width:0}
.ritem .c-name .pill{flex-shrink:0}
.ritem a.olink,a.olink{display:inline-flex;align-items:center;gap:4px;width:auto;height:auto;font-size:13px;color:var(--accent-text);text-decoration:none;font-weight:500}
a.olink:hover{text-decoration:underline}
@media(max-width:980px){.rrow{grid-template-columns:1fr 1fr}.rrow .c-main{grid-column:1/-1}}

/* Icono de empresa: inicial sobre un tono sacado del nombre */
.tile{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:9px;font-weight:650;font-size:14px;
  background:hsl(var(--h) 70% 60% / var(--tile-a));color:hsl(var(--h) 75% var(--tile-l));box-shadow:0 0 0 1px hsl(var(--h) 70% 60% / .22) inset}

/* ===== Etiquetas ===== */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:2px 8px;border-radius:6px;background:color-mix(in srgb,var(--violet) 14%,transparent);color:var(--purple);font-weight:550;white-space:nowrap;line-height:1.5}
.pill.ok,.stsel.ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.pill.warn,.stsel.warn{background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.pill.bad,.stsel.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.pill.info,.stsel.info{background:color-mix(in srgb,var(--blue) 14%,transparent);color:var(--blue)}
.pill.m-remoto{background:color-mix(in srgb,var(--teal) 14%,transparent);color:var(--teal)}
.pill.m-hibrido{background:color-mix(in srgb,var(--violet) 14%,transparent);color:var(--purple)}
.pill.m-presencial{background:transparent;color:var(--muted);font-weight:500;padding-left:0} /* lo habitual no necesita mancha */
.pill.neutral{background:var(--raise);color:var(--muted);font-weight:500}
.pill.new{background:transparent;color:var(--ink);box-shadow:0 0 0 1px var(--line2) inset;font-weight:500}
.pill.today{background:color-mix(in srgb,var(--violet) 16%,transparent);color:var(--purple);font-size:10.5px;letter-spacing:.06em;font-weight:700;padding:1px 6px}
.stsel{font-weight:600;border-color:transparent;cursor:pointer}
.stsel.neutral{background:var(--raise);color:var(--muted);font-weight:500}
.stsel option{background:var(--panel);color:var(--ink);font-weight:400}

/* ===== Ventanas, avisos y chat ===== */
.modal{position:fixed;inset:0;background:rgba(6,5,10,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;justify-content:center;align-items:flex-start;padding:calc(28px + env(safe-area-inset-top,0px)) 14px 28px;overflow-y:auto;z-index:20}
.modal .card{max-width:820px;width:100%;background:var(--panel);border-color:var(--line2);box-shadow:var(--shadow);border-radius:16px;padding:22px}
.meter{height:6px;border-radius:99px;background:var(--raise);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--violet))}
.tag{display:inline-flex;align-items:center;gap:4px;background:var(--raise);border:1px solid var(--line);color:var(--ink);border-radius:7px;padding:3px 6px 3px 10px;margin:3px 4px 3px 0;font-size:13px}
.tag button{background:none;border:0;cursor:pointer;color:var(--muted);padding:2px;border-radius:5px;display:grid;place-items:center}
.tag button:hover{color:var(--bad);background:var(--hover)}
ul.clean{margin:6px 0;padding-left:18px}
ul.clean li{margin:3px 0}
.chat{display:flex;flex-direction:column;gap:10px;max-height:52vh;overflow-y:auto;padding:4px}
.msg{padding:9px 12px;border-radius:14px;max-width:85%;white-space:pre-wrap}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.msg.a{align-self:flex-start;background:var(--raise);border:1px solid var(--line)}
.note{font-size:13px;color:var(--ink);background:color-mix(in srgb,var(--violet) 9%,transparent);border:1px solid color-mix(in srgb,var(--violet) 22%,transparent);border-radius:10px;padding:10px 12px}
pre.draft{white-space:pre-wrap;background:var(--field);border:1px solid var(--line2);border-radius:10px;padding:12px;font-family:inherit;margin:6px 0}
.sect{margin:0 0 8px;font-size:14px;font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--raise);color:var(--ink);border:1px solid var(--line2);box-shadow:var(--shadow);padding:8px 10px 8px 14px;border-radius:10px;z-index:40;font-size:13.5px;display:flex;align-items:center;gap:4px;animation:toastIn .25s cubic-bezier(.16,1,.3,1)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}}
/* Ventana de decisión (sustituye a los confirm() del navegador) */
#dlgRoot .modal{z-index:35;align-items:center}
#dlgRoot .card{max-width:600px}
.palin input:focus-visible{outline:none}
.dlgt{margin:0 0 8px;font-size:18px;font-weight:650}
.dlgd p{margin:0 0 10px}
.dlgb{margin-top:16px;justify-content:flex-end}
/* Candidaturas: filtros plegables y columna de encaje oculta si nadie la usa */
.fpanel{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:-2px 0 12px}
.nofit .lhead,.nofit .ritem{grid-template-columns:minmax(0,2.4fr) minmax(0,1.4fr) 100px 100px 170px 40px}
.nofit .c-fit,.nofit .h-fit{display:none}
@media(max-width:980px){.nofit .ritem{grid-template-columns:1fr 1fr}}
/* Radar: "Ya aplicada" neutro; coral solo en la fila bajo el ratón */
.rrow .btn[data-act="applied"]{background:var(--raise);color:var(--ink);border-color:var(--line2);font-weight:500}
.rrow:hover .btn[data-act="applied"],.rrow:focus-within .btn[data-act="applied"]{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:600}
.soon{display:flex;align-items:center;gap:8px;margin:4px 2px 0;font-size:13px;color:var(--muted)}
/* Movimiento: entrada de pestañas, salida de filas y el check de "Todo revisado" */
main>section.enter{animation:tabIn .22s cubic-bezier(.16,1,.3,1)}
@keyframes tabIn{from{opacity:0;transform:translateY(4px)}}
.hitem.leaving,.ritem.leaving{opacity:0;transform:translateX(14px);transition:opacity .18s ease-out,transform .18s ease-out}
.zero{padding:40px 18px 34px;text-align:center}
.zero svg{display:block;margin:0 auto 12px;color:var(--ok)}
/* El check se ve siempre; la animación solo lo "dibuja" encima */
.zero svg circle{stroke-dasharray:151;animation:drawC .5s cubic-bezier(.16,1,.3,1) both}
.zero svg path{stroke-dasharray:30;animation:drawP .35s .35s cubic-bezier(.16,1,.3,1) both}
@keyframes drawC{from{stroke-dashoffset:151}to{stroke-dashoffset:0}}
@keyframes drawP{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
.zero b{display:block;font-size:20px;font-weight:650;letter-spacing:-.01em;margin-bottom:4px}
.zero p{margin:0}
.tally{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:14px}
.palsec{padding:8px 10px 4px;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}
.palit .cmdic{flex:none;display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--raise);color:var(--muted);box-shadow:0 0 0 1px var(--line) inset}
/* Aviso de GitHub: una línea discreta en la cabecera, no una franja que compite con todo */
.hint{margin-left:auto;display:inline-flex;align-items:center;gap:7px;background:none;border:0;padding:4px 6px;border-radius:7px;font:inherit;font-size:12.5px;color:var(--muted);cursor:pointer}
.hint:hover{color:var(--ink);background:var(--hover)}
.hint i{width:6px;height:6px;border-radius:50%;background:var(--warn);display:block}
.hint u{text-underline-offset:3px}
.hint:not(.hidden)~.status,.hint:not(.hidden)~.topsearch{margin-left:0}
/* Inicio: el panel de ofertas manda */
.panel.home .panelh h3{font-size:17px;font-weight:650;letter-spacing:-.01em}
.hitem .h-note{display:none}
.hitem.sel .h-note{display:inline}

async function ghFail(r){

  if(r.status===403)return new Error("sin permiso para esa acción o límite alcanzado"+(m?" ("+m+")":""));
  if(r.status===404)return new Error("no se encuentra el repositorio: revisa usuario y nombre, y que el token tenga acceso a él");

async function ghConflict(cur){
  const when=x=>x.at?" · último cambio "+new Date(x.at).toLocaleString("es-ES",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):"";
  const n=x=>{const c=x.apps.filter(a=>!a.radar).length,o=x.apps.filter(a=>a.radar).length;return c+" candidatura"+(c===1?"":"s")+" y "+o+" oferta"+(o===1?"":"s")+when(x)};
  const c=await askChoice("Tus datos no coinciden con los de GitHub",
    `<p>Puede que los editaras desde otro dispositivo. Elige qué versión conservar: la otra se perderá.</p><ul class="clean"><li><b>En GitHub:</b> ${n(cur.data)}</li><li><b>En este dispositivo:</b> ${n(S)}</li></ul><p>Si no lo tienes claro, elige «Decidir luego»: no se borra nada.</p>`,
    [{id:"later",label:"Decidir luego",safe:true},{id:"local",label:"Subir los de este dispositivo",kind:"danger"},{id:"github",label:"Usar los de GitHub",kind:"danger"}]);
  if(c==="later"){setSave("Conflicto con GitHub sin resolver: no se ha borrado nada. Decide en Ajustes con «Sincronizar ahora».");return}
  if(c==="github"){
    adopt(cur.data);gh.sha=cur.sha;ghSaveCfg();clearDirty();setSave("Datos cargados desde GitHub ✓");
  }else{gh.sha=cur.sha;await ghPush()}
}
async function ghPush(){
  const body={message:"Panel de empleo: "+new Date().toISOString().slice(0,16).replace("T"," "),content:b64enc(JSON.stringify(S,null,2))};
  if(gh.sha)body.sha=gh.sha;
  let r=await ghFetch("PUT",body);
  if(r.status===409||r.status===422){
    const cur=await ghGet();
    if(cur.missing){delete body.sha;r=await ghFetch("PUT",body)}
    else if(cur.sha!==gh.sha){await ghConflict(cur);return}
    else throw await ghFail(r);
  }
  if(!r.ok)throw await ghFail(r);
  const j=await r.json();
  gh.sha=j.content.sha;gh.last=Date.now();ghSaveCfg();clearDirty();
}
async function ghFlush(){
  while(ghBusy)await new Promise(res=>setTimeout(res,120));
  ghBusy=true;
  try{await ghPush()}finally{ghBusy=false}
}
async function ghSync(manual){
  if(!ghOn()||ghBusy)return;
  ghBusy=true;
  try{
    setSave("Sincronizando con GitHub…");
    const r=await ghGet();
    if(r.missing){await ghPush();setSave("Archivo de datos creado en GitHub ✓")}
    else if(r.sha===gh.sha){
      if(isDirty()){await ghPush();setSave("Cambios subidos a GitHub ✓")}else setSave("GitHub al día ✓");
    }else{
      const same=sameData(r.data,S);
      if(same){gh.sha=r.sha;clearDirty();setSave("GitHub al día ✓")}
      else if(isDirty()||(!gh.sha&&S.apps.length>0))await ghConflict(r);
      else if(!manual&&$("modalRoot")&&$("modalRoot").innerHTML){setSave("Hay datos nuevos en GitHub; se cargarán la próxima vez que sincronices.")}
      else{adopt(r.data);gh.sha=r.sha;clearDirty();setSave("Datos actualizados desde GitHub ✓")}
    }
    gh.last=Date.now();ghSaveCfg();
  }catch(e){setSave("GitHub: "+((e&&e.message)||"error"),true)}
  ghBusy=false;renderGhCard();
}
/* ===== Bandeja automática: la búsqueda diaria deja ofertas en este archivo del repositorio ===== */
const INBOX="ofertas-nuevas.json";
async function ghInbox(){
  if(!ghOn()||ghBusy)return;
  try{
    const r=await ghFetch("GET",null,true,INBOX);
    if(r.status===404)return; // la búsqueda diaria aún no ha creado el archivo
    if(!r.ok)throw await ghFail(r);
    const j=await r.json();
    const txt=b64dec(j.content||"").trim();
    if(!txt||txt==="[]")return;
    let res;
    try{res=importOffers(txt)}catch(e){setSave("La bandeja de ofertas de GitHub tiene un formato que no entiendo; no la he tocado.");return}
    if(res.added||res.dup||res.skipped)S.search.since=new Date(Date.now()-864e5).toISOString().slice(0,10);
    save();render();
    if(res.added)toast(res.added+" oferta"+(res.added===1?" nueva":"s nuevas")+" en Inicio");
    // Vaciar la bandeja. Si falla, no pasa nada: la próxima vez se omiten las repetidas.
    await ghFetch("PUT",{message:"Bandeja de ofertas vaciada",content:b64enc("[]\n"),sha:j.sha},false,INBOX);
  }catch(e){setSave("Bandeja de ofertas: "+((e&&e.message)||"error"))}
}
/* Las ofertas que nunca abriste ni decidiste se borran a los 30 días (casi siempre ya están cerradas) */
const daysAgo=iso=>Math.round((Date.parse(todayISO())-Date.parse(iso))/864e5);
function cleanOld(){
  const old=S.apps.filter(a=>a.radar&&a.inbox&&!a.seen&&daysAgo(a.inbox)>30);
  old.forEach(a=>{rememberDiscard(a);S.apps.splice(S.apps.indexOf(a),1)});
  if(old.length){save();render()}
}
async function afterSync(){cleanOld();await ghInbox()}

function renderGhCard(){
  const c=$("ghCard");if(!c)return;
  c.innerHTML=ghHtml();
  const on=(id,f)=>{const b=$(id);if(b)b.onclick=f};
  on("ghConnect",async()=>{
    const owner=$("ghOwner").value.trim(),repo=$("ghRepo").value.trim(),path=$("ghPath").value.trim()||DATA_NAME;
    const tok=$("ghToken").value.trim()||(gh&&gh.token)||"";
    if(!owner||!repo||!tok){toast("Faltan usuario, repositorio o token");return}
    const same=gh&&gh.owner===owner&&gh.repo===repo&&gh.path===path;
    gh={owner:owner,repo:repo,path:path,token:tok,sha:same?gh.sha:"",last:same?gh.last:0};
    ghSaveCfg();renderLinkBar();await ghSync(true);
  });
  on("ghNow",()=>ghSync(true));
  on("scExp",exportData);on("scImp",importPick);
  on("ghOff",async()=>{
    const ok=await askChoice("¿Desconectar GitHub?","<p>Este navegador dejará de sincronizar. Tus datos en GitHub no se borran y puedes volver a conectar cuando quieras.</p>",[{id:"no",label:"Cancelar",safe:true},{id:"yes",label:"Desconectar",kind:"danger"}]);
    if(ok!=="yes")return;
    gh=null;try{localStorage.removeItem(GH_KEY)}catch(e){}
    renderLinkBar();
  });
}

  L.push("- Titular: "+v(p.headline));
  L.push("- Ubicación: "+v(p.location));
  L.push("- Modalidad que suelo preferir: "+v(p.modality)+" (pero quiero ver las tres modalidades)");

  L.push("- Roles que busco: "+lst(p.targetRoles));
  L.push("- Skills y software: "+lst(p.skills));
  L.push("- Formación: "+v(p.education));
  L.push("- Experiencia: "+v(p.experience));

  L.push("## DÓNDE BUSCAR");
  if(g.sources.length){
    g.sources.forEach(s=>L.push("- "+s.name+" ("+s.url+") → "+(s.mode==="mejores"?"solo las "+g.topN+" ofertas que mejor encajen con mi perfil":"TODAS las ofertas abiertas que encajen con mi perfil")));
  }else L.push("- No he indicado páginas: busca en las principales webs de empleo de videojuegos y en las webs de carreras de estudios relevantes.");
  L.push("");
  L.push("## QUÉ CUENTA COMO ENCAJAR");
  L.push("- El puesto es uno de los roles que busco o muy cercano a ellos.");
  L.push("- El nivel es acorde con la experiencia que te indico arriba. Incluye prácticas y puestos junior, y descarta los que pidan mucha más experiencia de la que tengo.");
  L.push("- Las herramientas que piden coinciden en buena parte con mis skills.");

  L.push("## REGLAS");

  L.push("- Pon el enlace directo a la oferta. Si solo encuentras un agregador, pon ese enlace y avísame en las notas.");
  L.push("- Si una página no se deja leer (por ejemplo, bloquea el acceso o pide iniciar sesión), dímelo en vez de rellenar con otras cosas.");
  L.push("- Si no sabes el país, la ciudad o la modalidad, déjalo vacío y dímelo en las notas. No lo adivines.");
  if(g.since){
    L.push("- Solo me interesan las ofertas publicadas (o republicadas) desde el "+fmt(g.since)+" (fecha de mi última búsqueda, con un día de margen). Descarta las anteriores. Si una oferta no muestra fecha de publicación, inclúyela solo si encaja muy bien y anota \"sin fecha visible\" en las notas.");
  }
  L.push("");
  L.push("## CLASIFICACIÓN EN TRES APARTADOS");
  L.push("1. Prácticas: prácticas, becas, internships, trainee o apprenticeship, estén donde estén.");
  L.push("2. En España o en remoto: ofertas que no sean prácticas, en España con cualquier modalidad o remotas en cualquier país.");
  L.push("3. Presencial o híbrido fuera de España: ofertas que no sean prácticas.");
  L.push("");
  L.push("## FORMATO DE LA RESPUESTA");
  L.push("Primero, un resumen legible agrupado en esos tres apartados: empresa, puesto, ciudad y país, modalidad, encaje y una línea con el motivo.");
  L.push("Después, un único bloque de código JSON con todas las ofertas, para pegarlo en mi panel. Es una lista de objetos con esta forma exacta:");
  L.push('[{"company":"","role":"","url":"","country":"","city":"","modality":"","fit":"","kind":"","notes":""}]');
  L.push("- country: nombre del país en español.");
  L.push('- modality: solo "Remoto", "Híbrido" o "Presencial" (o "" si no lo sabes).');
  L.push('- fit: "medio" o "probable", según lo bien que encaja con mi perfil.');
  L.push('- kind: "practicas" si es de prácticas y "no" si no lo es.');
  L.push("- notes: por qué encaja, dudas, la fecha de publicación si la ves, y si ya me presenté a esa empresa.");

function renderSearchCard(){
  const c=$("searchCard");if(!c)return;
  const g=S.search;
  c.innerHTML=searchHtml();
  $("seExtra").value=g.extra||"";
  const refresh=()=>{$("sePrompt").value=buildPrompt()};
  refresh();
  // Guardado automático de cada cambio (traído de la versión del repositorio)
  c.querySelectorAll("[data-sm]").forEach(s=>s.onchange=()=>{g.sources[+s.dataset.sm].mode=s.value;refresh();save()});
  c.querySelectorAll("[data-rs]").forEach(b=>b.onclick=()=>{g.sources.splice(+b.dataset.rs,1);save();renderSearchCard()});
  c.querySelectorAll("[data-sg]").forEach(b=>b.onclick=()=>{const s=SUGG[+b.dataset.sg];g.sources.push({name:s[0],url:s[1],mode:s[2]});save();renderSearchCard()});
  $("seAdd").onclick=()=>{
    let u=$("seUrl").value.trim(),n=$("seName").value.trim();
    if(!u){toast("Falta la dirección de la página");return}
    if(!/^https?:\/\//i.test(u))u="https://"+u;
    if(!n){try{n=new URL(u).hostname.replace(/^www\./,"")}catch(e){n=u}}
    if(!g.sources.some(s=>s.url===u))g.sources.push({name:n,url:u,mode:$("seMode").value});
    save();renderSearchCard();
  };
  $("seSince").addEventListener("input",e=>{g.since=e.target.value;refresh()});
  $("seSince").addEventListener("change",()=>save());
  $("seTop").onchange=e=>{g.topN=parseInt(e.target.value,10)||5;refresh();save()};
  $("seExtra").addEventListener("input",e=>{g.extra=e.target.value;refresh()});
  $("seExtra").addEventListener("change",()=>save());
  $("seCopy").onclick=async()=>{
    const ta=$("sePrompt"),txt=buildPrompt();
    try{await navigator.clipboard.writeText(txt);toast("Prompt copiado")}
    catch(e){const dt=ta.closest("details");if(dt)dt.open=true;ta.focus();ta.select();try{document.execCommand("copy");toast("Prompt copiado")}catch(e2){toast("Selecciona el texto y copia con Ctrl+C")}}
  };
}

/* Aviso con "Deshacer". Ctrl+Z deshace lo último aunque el aviso ya se haya ido (hasta el siguiente cambio) */
let lastUndo=null;
function toastUndo(msg,undo){
  document.querySelectorAll(".toast").forEach(x=>x.remove());
  const d=document.createElement("div");d.className="toast";d.setAttribute("role","status");
  d.innerHTML=esc(msg)+' <button class="btn sm" style="margin-left:10px;padding:2px 10px">Deshacer <kbd>Ctrl Z</kbd></button>';
  const run=()=>{if(lastUndo!==run)return;lastUndo=null;undo();d.remove();toast("Deshecho")};
  lastUndo=run;
  d.querySelector("button").onclick=run;
  document.body.appendChild(d);setTimeout(()=>d.remove(),8000);
}
/* Cambia una ficha y ofrece deshacer devolviéndola exactamente a como estaba */
function withUndo(a,msg,change){
  const snap=JSON.stringify(a);change();save();render();
  toastUndo(msg,()=>{const o=JSON.parse(snap);Object.keys(a).forEach(k=>delete a[k]);Object.assign(a,o);save();render()});
}
/* Borra una candidatura u oferta con opción de deshacer (sin ventanas de confirmación) */
function deleteEntry(a){
  if(a.radar){removeOffer(a);return}
  const idx=S.apps.indexOf(a);if(idx<0)return;
  S.apps.splice(idx,1);save();render();
  toastUndo("Candidatura eliminada",()=>{S.apps.splice(Math.min(idx,S.apps.length),0,a);save();render()});
}

/* ===== Ventanas: foco, etiquetas y decisiones ===== */
let lastFocus=null,dlg=null;
// Da nombre accesible a los campos que solo tienen una etiqueta visual o un texto de ejemplo
function labelFields(root){
  root.querySelectorAll("input:not([type=file]):not([aria-label]),select:not([aria-label]),textarea:not([aria-label])").forEach(f=>{
    const p=f.previousElementSibling;
    const t=p&&p.tagName==="LABEL"?p.textContent:f.placeholder;
    if(t)f.setAttribute("aria-label",t.trim());
  });
}
function openModal(html){
  const fresh=!$("modalRoot").innerHTML;
  if(fresh)lastFocus=document.activeElement;
  $("modalRoot").innerHTML=html;
  const m=$("modalRoot").querySelector(".modal"),card=m.querySelector(".card"),h=m.querySelector("h2");
  m.setAttribute("role","dialog");m.setAttribute("aria-modal","true");
  if(h){h.id="modalTitle";m.setAttribute("aria-labelledby","modalTitle")}
  labelFields(m);
  // El foco empieza en el primer campo (o en la propia ventana si no tiene campos)
  if(fresh){const f=card.querySelector("[data-autofocus]")||card.querySelector("input:not([type=file]),textarea,select");if(f)f.focus({preventScroll:true});else{card.setAttribute("tabindex","-1");card.focus({preventScroll:true})}}
}
let beforeClose=null; // la ficha puede pedir confirmación si tiene cambios sin guardar
function closeModal(){
  $("modalRoot").innerHTML="";beforeClose=null;
  if(lastFocus&&document.contains(lastFocus))lastFocus.focus({preventScroll:true});
  lastFocus=null;
}
async function requestClose(){if(beforeClose&&!(await beforeClose()))return;closeModal()}
// Mantiene el Tab dentro de la ventana abierta
function trapTab(e,root){
  const f=[...root.querySelectorAll('a[href],button:not([disabled]),input,select,textarea,[tabindex]:not([tabindex="-1"])')].filter(x=>x.offsetParent!==null);
  if(!f.length)return;
  const first=f[0],last=f[f.length-1],cur=document.activeElement;
  if(!root.contains(cur)){first.focus();e.preventDefault()}
  else if(e.shiftKey&&cur===first){last.focus();e.preventDefault()}
  else if(!e.shiftKey&&cur===last){first.focus();e.preventDefault()}
}

    $("dlgRoot").innerHTML=`<div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="dlgT" aria-describedby="dlgD"><div class="card">
      <h2 class="dlgt" id="dlgT">${esc(title)}</h2><div class="muted dlgd" id="dlgD">${html}</div>

    const done=v=>{$("dlgRoot").innerHTML="";dlg=null;if(prev&&document.contains(prev))prev.focus({preventScroll:true});res(v)};
    $("dlgRoot").querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>done(b.dataset.c));
    dlg={cancel:()=>done(safe)};

/* ===== Utilidades de dominio ===== */
function fitPill(f){
  const x=FITS.find(a=>a[0]===f);
  if(!x)return '<span class="pill neutral" title="Aún no se ha valorado cuánto encaja con tu perfil">Sin valorar</span>';
  const tip={probable:"Encaje probable: cumples casi todo lo que piden",medio:"Encaje medio: cumples parte; revisa qué te falta",poco:"Encaje bajo: piden bastante que aún no tienes"}[f];
  return `<span class="pill ${f==="probable"?"ok":f==="medio"?"warn":"bad"}" title="${tip}">${x[1]}</span>`;
}
function modPill(m){
  if(!m)return '<span class="muted">—</span>';
  const k=m==="Remoto"?"m-remoto":m==="Híbrido"?"m-hibrido":"m-presencial";
  return `<span class="pill ${k}">${esc(m)}</span>`;
}
function stageClass(s){return s==="Sin respuesta"?"neutral":s==="Rechazada"?"bad":"info"} // "Sin respuesta" es lo normal: neutro, no ámbar
function fitFromMatch(m){return m>=70?"probable":m>=45?"medio":"poco"}
function rulesText(){return S.rules.length?"Reglas definidas por el usuario (síguelas siempre):\n- "+S.rules.join("\n- "):"Sin reglas personalizadas."}

}
const KW=["zbrush","maya","3ds max","blender","marvelous","substance","rizom","topogun","xgen","marmoset","photoshop","unreal","unity","houdini","speedtree","retopolog","grooming","hair","cloth","tela","sculpt","escultura","texturi","pbr","aaa","rigging","animation","animación","lod","bake","stylized","realistic","realista","character","personaje","environment","entorno","props","hard surface","nanite","metahuman","perforce","git"];
function quickScore(desc){
  const d=desc.toLowerCase(),sk=S.profile.skills.map(s=>s.toLowerCase());
  const found=KW.filter(k=>d.includes(k));
  if(!found.length)return null;
  const mine=found.filter(k=>sk.some(s=>s.includes(k)||k.includes(s)));
  return Math.round(25+75*(mine.length/found.length)*Math.min(1,found.length/6+0.4));
}

  };
}

/* ===== Teclado: Ctrl+K en todas partes; flechas, S, A, E e Intro en Inicio ===== */
document.addEventListener("keydown",e=>{
  // Una pregunta abierta manda: Esc elige la opción segura y Tab no sale de ella
  if(dlg){if(e.key==="Escape"){e.preventDefault();dlg.cancel()}else if(e.key==="Tab")trapTab(e,$("dlgRoot"));return}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();pal?closePal():openPal();return}
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==="z"&&lastUndo&&!(e.target.closest&&e.target.closest("input,textarea,[contenteditable]"))){e.preventDefault();lastUndo();return}
  if(e.key==="Tab"&&!pal&&$("modalRoot").innerHTML){trapTab(e,$("modalRoot"));return}
  if(pal){
    if(e.key==="Tab"){trapTab(e,$("palRoot"));return}
    if(e.key==="Escape")closePal();
    else if(e.key==="ArrowDown"&&pal.res.length){pal.sel=(pal.sel+1)%pal.res.length;palMark()}
    else if(e.key==="ArrowUp"&&pal.res.length){pal.sel=(pal.sel-1+pal.res.length)%pal.res.length;palMark()}
    else if(e.key==="Enter")palGo(pal.sel);
    else return;
    e.preventDefault();return;
  }
  if(e.key==="Escape"&&$("modalRoot").innerHTML){requestClose();return}
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.target.closest&&e.target.closest("input,textarea,select,[contenteditable]"))return;
  if($("modalRoot").innerHTML||$("t-home").classList.contains("hidden"))return;
  const rows=[...document.querySelectorAll("#homeList .hitem")];if(!rows.length)return;
  // Solo cuando estás en Inicio (nada enfocado fuera de él); las teclas sueltas se pueden apagar en Ajustes
  const ae=document.activeElement;if(ae&&ae!==document.body&&!$("t-home").contains(ae)&&!ae.closest("header"))return;
  const k=e.key.toLowerCase(),row=rows[hsel],letters=keysOn();
  if(k==="arrowdown"||(letters&&k==="j"))hsel=Math.min(hsel+1,rows.length-1);
  else if(k==="arrowup"||(letters&&k==="k"))hsel=Math.max(hsel-1,0);
  else if(letters&&(k==="s"||k==="a"||k==="e")){row.querySelector(`[data-act="${k==="s"?"like":k==="a"?"applied":"del"}"]`).click();e.preventDefault();return}
  else if(k==="enter"){
    if(e.target.closest("button,a"))return; // Intro sobre un botón ya hace lo suyo

});

function uiSet(k,v){try{const o=JSON.parse(localStorage.getItem("panel-empleo-ui")||"{}");o[k]=v;localStorage.setItem("panel-empleo-ui",JSON.stringify(o))}catch(e){}}

function passFilter(a){
  if(filt.st==="__resp"){if(!RESP.includes(a.stage))return false}
  else if(filt.st!=="all"&&a.stage!==filt.st)return false;
  if(filt.mod!=="all"&&(filt.mod==="__none"?a.modality:a.modality!==filt.mod))return false;
  if(filt.fit!=="all"&&(filt.fit==="__none"?a.fit:a.fit!==filt.fit))return false;
  if(filt.country!=="all"&&(filt.country==="__none"?a.country:a.country!==filt.country))return false;
  if(filt.city!=="all"&&(filt.city==="__none"?a.city:a.city!==filt.city))return false;
  const q=filt.q.trim().toLowerCase();
  if(q&&!(a.company+" "+a.role+" "+a.city+" "+a.country).toLowerCase().includes(q))return false;
  return true;
}

/* ===== Radar ===== */
const norm=s=>String(s||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim().toLowerCase();
function isIntern(a){
  if(a.kind==="practicas")return true;
  if(a.kind==="no")return false;
  return /\b(interns?|internship|trainee|apprentice|becari[oa]s?|beca)\b|pr[aá]cticas/i.test(a.role||"");
}
function radarGroup(a){
  if(isIntern(a))return "practicas";
  if(norm(a.country)==="espana"||a.modality==="Remoto")return "esp";
  if(a.country&&(a.modality==="Presencial"||a.modality==="Híbrido"))return "fuera";
  return "otros";
}
const RCHIPS=[["all","Todas"],["liked","Me interesan"],["esp","España o remoto"],["fuera","Fuera de España"],["practicas","Prácticas"],["otros","Sin clasificar"],["nuevas","Sin revisar"]];
let rv=Object.assign({sort:"date",g:"all"},(()=>{try{return JSON.parse(ss("rv")||"{}")}catch(e){return{}}})());
const RHEAD='<div class="lhead rhead"><div>Empresa y puesto</div><div>Encaje</div><div>Lugar</div><div>Modalidad</div><div>Fecha</div><div></div></div>';
let radarAllNew=false; // si todas están sin revisar, marcarlas no aporta nada
function radarRow(a){
  // "Me interesa" como etiqueta; "sin revisar" como un punto discreto, y solo cuando distingue algo
  const dot=!a.liked&&isUnseen(a)&&!radarAllNew&&rv.g!=="nuevas"?'<span class="newdot" title="Sin revisar" role="img" aria-label="Sin revisar"></span>':"";
  const tag=a.liked?'<span class="pill">Me interesa</span>':"";
  return `<div class="ritem rrow" data-id="${a.id}" tabindex="0" aria-label="${esc((a.company||"Sin empresa")+" · "+(a.role||""))}: abrir ficha">
    <div class="c-main">${tile(a.company)}<div><div class="c-name">${dot}<b>${esc(a.company||"Sin empresa")}</b>${tag}</div><span>${esc(a.role||"—")}</span></div></div>
    <div class="c-fit">${fitPill(a.fit)}</div>
    <div class="c-place">${esc(place(a))}</div>
    <div class="c-mod">${modPill(a.modality)}</div>
    <div class="c-date">${fmt(a.date)}</div>
    <div class="c-stage"><span class="c-link">${a.url?`<a href="${esc(a.url)}" target="_blank" rel="noopener" title="Abrir oferta" aria-label="Abrir oferta">${ic("ext",17)}</a>`:""}</span><button class="btn sm" data-act="applied">Ya aplicada</button><button class="btn ghost sm" data-act="del">Descartar</button></div>
  </div>`;
}
function renderRadar(){
  const all=S.apps.filter(a=>a.radar);
  const n={all:all.length,liked:all.filter(a=>a.liked).length,esp:0,fuera:0,practicas:0,otros:0,nuevas:all.filter(isUnseen).length};
  all.forEach(a=>n[radarGroup(a)]++);
  radarAllNew=n.all>0&&n.nuevas===n.all;
  if(rv.g!=="all"&&!n[rv.g])rv.g="all";
  const byDate=byNewest; // "más recientes" = lo último que entró en el radar
  const order=rv.sort==="fit"?(x,y)=>((FITN[y.fit]||0)-(FITN[x.fit]||0))||byDate(x,y):byDate;
  const list=all.filter(a=>rv.g==="all"||(rv.g==="liked"?a.liked:rv.g==="nuevas"?isUnseen(a):radarGroup(a)===rv.g))
    .sort((x,y)=>(!!y.liked-!!x.liked)||order(x,y)); // las que te interesan, siempre arriba
  $("t-radar").innerHTML=`
  <div class="row" style="justify-content:space-between;margin-bottom:12px">
    <div><h2 class="ptitle">Radar de ofertas</h2>
    <span class="muted">Ofertas guardadas antes de candidatarte. Las que te interesan van siempre arriba.</span></div>
    <div class="row"><button class="btn sec" id="newOffer">${ic("plus",15)}Añadir a mano</button><button class="btn" id="impOffers">Importar ofertas</button></div>
  </div>
  <div class="toolbar" style="justify-content:space-between">
    <div class="chips">${RCHIPS.filter(c=>c[0]==="all"||n[c[0]]||["esp","fuera","practicas"].includes(c[0])).map(c=>`<button class="chip ${rv.g===c[0]?"on":""}" data-g="${c[0]}">${c[1]} ${n[c[0]]}</button>`).join("")}</div>
    <select class="filt" id="rSort" style="width:auto;padding:5px 8px;font-size:13px" aria-label="Ordenar ofertas">${opts([["date","Ordenar: más recientes"],["fit","Ordenar: mejor encaje"]],rv.sort)}</select>
  </div>`+
  (list.length?RHEAD+'<div id="rList">'+list.map(radarRow).join("")+'</div>':'<div class="card muted">No hay ofertas en este apartado.</div>');
  const keep=()=>{ss("rv",JSON.stringify(rv));renderRadar()};
  $("t-radar").querySelectorAll(".chip").forEach(b=>b.onclick=()=>{rv.g=b.dataset.g;keep()});
  $("rSort").onchange=e=>{rv.sort=e.target.value;keep()};
  $("newOffer").onclick=()=>openApp(null,true);
  $("impOffers").onclick=openImport;
  if(list.length)wireRows($("rList"),true);
}

/* ===== Acciones del radar: aplicada / eliminar ===== */
const okU=u=>String(u||"").trim().toLowerCase().replace(/^https?:\/\/(www\.)?/,"").replace(/[?#].*$/,"").replace(/\/+$/,"");
const okR=a=>norm(a.company)+"|"+norm(a.role)+"|"+norm(a.country);
/* Lo último que añadiste, arriba: primero por momento de alta (addedAt) y, si no lo hay, por fecha */
function byNewest(x,y){
  const ax=x.addedAt||0,ay=y.addedAt||0;
  if(ax!==ay)return ay-ax;
  return (y.date||"").localeCompare(x.date||"");
}
function markApplied(a){
  a.radar=false;a.inbox="";a.stage="Sin respuesta";a.date=todayISO();a.addedAt=Date.now();
  a.events.push({d:todayISO(),t:"Candidatura enviada (pasada desde el radar)"});
}
function rememberDiscard(a){
  const e={u:okU(a.url),k:okR(a)};
  S.discarded.push(e);
  if(S.discarded.length>1000)S.discarded.splice(0,S.discarded.length-1000);
  return e;
}
function removeOffer(a){
  const idx=S.apps.indexOf(a);if(idx<0)return;
  S.apps.splice(idx,1);
  const e=rememberDiscard(a);
  save();render();
  toastUndo("Oferta descartada",()=>{
    S.apps.splice(Math.min(idx,S.apps.length),0,a);
    const j=S.discarded.indexOf(e);if(j>=0)S.discarded.splice(j,1);
    save();render();
  });
}

/* ===== Importar ofertas (sin borrar lo existente) ===== */
function importOffers(text){
  const t=text.trim().replace(/^```(?:json)?\s*/i,"").replace(/\s*```$/,"");
  let data=JSON.parse(t);
  if(!Array.isArray(data))data=data.ofertas||data.offers||[];
  const keyU=okU,keyR=okR;
  let added=0,dup=0,bad=0,again=0,skipped=0;
  const t0=Date.now();
  data.forEach((o,ix)=>{
    if(!o||(!o.company&&!o.role)){bad++;return}
    const a={id:uid(),addedAt:t0+(data.length-ix),company:String(o.company||"").trim(),role:String(o.role||"").trim(),city:String(o.city||"").trim(),country:String(o.country||"").trim(),
      modality:MODS.includes(o.modality)?o.modality:"",date:/^\d{4}-\d{2}-\d{2}$/.test(o.date||"")?o.date:todayISO(),
      fit:["poco","medio","probable"].includes(o.fit)?o.fit:"",stage:"Preparando",url:String(o.url||"").trim(),email:"",notes:String(o.notes||""),desc:"",
      match:null,analysis:null,radar:true,inbox:todayISO(),kind:["practicas","no"].includes(o.kind)?o.kind:"",events:[{d:todayISO(),t:"Importada de una búsqueda con Claude"}]};
    if(S.discarded.some(d=>(a.url&&d.u&&d.u===keyU(a.url))||d.k===keyR(a))){skipped++;return}
    if(S.apps.some(x=>a.url&&x.url&&keyU(a.url)===keyU(x.url))){dup++;return}
    const same=S.apps.filter(x=>keyR(x)===keyR(a));
    if(same.some(x=>x.radar)){dup++;return}
    if(same.length){
      const x=same.slice().sort((p,q)=>(q.date||"").localeCompare(p.date||""))[0];
      a.notes=("Posible repetición: ya te presentaste a «"+(x.role||"este puesto")+"» en "+x.company+" (estado: "+x.stage+(x.date?", "+fmt(x.date):"")+"). "+a.notes).trim();
      again++;
    }
    S.apps.push(a);added++;
  });
  return{added:added,dup:dup,bad:bad,again:again,skipped:skipped};
}
function openImport(){
  openModal(`<div class="modal"><div class="card">
    <div class="row" style="justify-content:space-between"><h2 style="margin:0;font-size:18px">Importar ofertas</h2><button class="btn sec sm" id="impX">Cerrar</button></div>
    <p class="muted" style="margin-top:6px">Pega aquí las ofertas que te haya preparado Claude (formato JSON) o elige el archivo. Se añaden al radar sin borrar nada, y se omiten las que ya tengas.</p>
    <textarea id="impText" style="min-height:200px" placeholder='[{"company":"…","role":"…","url":"…","country":"…","city":"…","modality":"Remoto","fit":"medio","kind":"practicas","notes":"…"}]'></textarea>
    <div class="row" style="margin-top:10px"><input type="file" id="impFile" accept=".json,application/json" style="max-width:320px"><button class="btn" id="impGo">Importar</button></div>
    <div id="impOut" style="margin-top:12px"></div>
  </div></div>`);
  $("impX").onclick=closeModal;
  $("impFile").onchange=async e=>{const f=e.target.files[0];if(f)$("impText").value=await f.text()};
  $("impGo").onclick=()=>{
    const txt=$("impText").value;
    if(!txt.trim()){toast("Pega las ofertas o elige un archivo");return}
    try{
      const r=importOffers(txt);
      if(r.added||r.dup||r.skipped){S.search.since=new Date(Date.now()-864e5).toISOString().slice(0,10);save();render()}
      $("impOut").innerHTML='<div class="note">'+r.added+' oferta'+(r.added===1?"":"s")+' añadida'+(r.added===1?"":"s")+' al radar'+(r.dup?' · '+r.dup+' omitida'+(r.dup===1?"":"s")+' por ser la misma oferta que ya tienes':"")+(r.skipped?' · '+r.skipped+' omitida'+(r.skipped===1?"":"s")+' por haberlas eliminado antes':"")+(r.again?' · '+r.again+' parece'+(r.again===1?"":"n")+' una repetición de una candidatura anterior (míralo en las notas)':"")+(r.bad?' · '+r.bad+' sin datos suficientes':"")+'.'+((r.added||r.dup||r.skipped)?' Próxima búsqueda: ofertas publicadas desde el '+fmt(S.search.since)+'.':'')+'</div>';
    }catch(e){$("impOut").innerHTML='<div class="note">No he podido leer el formato. Asegúrate de pegar el contenido completo tal como te lo di.</div>'}
  };
}

/* ===== Ficha / edición ===== */
function openApp(id,radar){
  const orig=id?S.apps.find(x=>x.id===id):null;
  const d=orig?JSON.parse(JSON.stringify(orig)):{id:uid(),addedAt:Date.now(),company:"",role:"",city:"",country:"",modality:"",date:todayISO(),fit:"",stage:radar?"Preparando":"Sin respuesta",url:"",email:"",notes:"",desc:"",match:null,analysis:null,radar:!!radar,events:[{d:todayISO(),t:radar?"Oferta añadida al radar":"Candidatura creada"}]};
  const read=()=>{
    d.company=$("f-company").value.trim();d.role=$("f-role").value.trim();
    d.city=$("f-city").value.trim();d.country=$("f-country").value.trim();d.modality=$("f-mod").value;
    d.date=$("f-date").value;d.fit=$("f-fit").value;
    d.url=$("f-url").value.trim();d.email=$("f-email").value.trim();
    d.desc=$("f-desc").value;d.notes=$("f-notes").value;
    const kd=$("f-kind");if(kd)d.kind=kd.value;
    const st=$("f-stage");
    if(st&&st.value!==d.stage){d.stage=st.value;d.events.push({d:todayISO(),t:"Estado → "+d.stage})}
  };
  const commit=()=>{
    if(orig)Object.assign(orig,d);else S.apps.push(d);
    save();render();
  };
  function draw(){
    openModal(`<div class="modal"><div class="card">
      <div class="row" style="justify-content:space-between;flex-wrap:nowrap"><h2 style="margin:0;font-size:18px">${orig?esc(d.company||"Sin empresa")+(d.role?`<span class="muted" style="font-weight:500"> · ${esc(d.role)}</span>`:""):(d.radar?"Nueva oferta":"Nueva candidatura")}</h2><button class="btn sec sm" id="x">Cerrar</button></div>
      <div id="aiOut">${d.analysis?analysisHtml(d):""}</div>
      <!-- Lo que decides: abrir la oferta, su encaje y (en candidaturas) su estado -->
      <div class="dstrip">
        ${d.url?`<a class="olink" href="${esc(d.url)}" target="_blank" rel="noopener">Abrir oferta ${ic("ext",14)}</a>`:""}
        <div><label>Encaje</label><select id="f-fit"><option value="">Sin valorar</option>${FITS.map(f=>`<option value="${f[0]}" ${f[0]===d.fit?"selected":""}>${f[1]}</option>`).join("")}</select></div>
        ${d.radar?"":`<div><label>Estado</label><select id="f-stage">${STAGES.map(s=>`<option ${s===d.stage?"selected":""}>${s}</option>`).join("")}</select></div>`}
      </div>
      <label>Notas</label><textarea id="f-notes" ${orig?"data-autofocus":""}>${esc(d.notes)}</textarea>
      <label>Descripción de la oferta${HAS_CL?" (pega aquí el texto para analizarla)":""}</label>
      <textarea id="f-desc" style="min-height:110px">${esc(d.desc)}</textarea>
      <!-- Los datos de identificación: abiertos en fichas nuevas o incompletas, plegados en el resto -->
      <details class="datos" ${!orig||!d.company?"open":""}>
        <summary>Datos de la ${d.radar?"oferta":"candidatura"}</summary>
        <div class="grid2">
          <div><label>Empresa</label><input id="f-company" value="${esc(d.company)}" ${orig?"":"data-autofocus"}></div>
          <div><label>Puesto</label><input id="f-role" value="${esc(d.role)}"></div>
          <div><label>Ciudad</label><input id="f-city" value="${esc(d.city)}"></div>
          <div><label>País</label><input id="f-country" value="${esc(d.country)}"></div>
          <div><label>Modalidad</label><select id="f-mod"><option value="">—</option>${MODS.map(m=>`<option ${m===d.modality?"selected":""}>${m}</option>`).join("")}</select></div>
          <div><label>Fecha</label><input type="date" id="f-date" value="${esc(d.date)}"></div>
          <div><label>Correo de contacto</label><input id="f-email" value="${esc(d.email)}"></div>
          ${d.radar?`<div><label>¿Es de prácticas?</label><select id="f-kind"><option value="">Automático (según el puesto)</option><option value="practicas" ${d.kind==="practicas"?"selected":""}>Sí, es de prácticas</option><option value="no" ${d.kind==="no"?"selected":""}>No es de prácticas</option></select></div>`:""}
        </div>
        <label>Enlace a la oferta</label><input id="f-url" value="${esc(d.url)}" placeholder="https://...">
      </details>
      <div class="row" style="margin-top:12px">
        ${HAS_CL?'<button class="btn" id="analyze">Analizar con IA</button>':""}
        <button class="btn ${HAS_CL?"sec":""}" id="save">Guardar</button>
        ${d.radar?'<button class="btn sec" id="toBoard">Ya aplicada</button>':""}
        ${orig?`<button class="btn ghost" id="del" style="margin-left:auto">${orig.radar?"Descartar":"Eliminar"}</button>`:""}
      </div>
      ${d.events.filter(e=>e.t).length?`<h3 class="sect" style="margin-top:18px">Historial</h3><ul class="clean muted">${d.events.filter(e=>e.t).slice().reverse().map(e=>`<li>${fmt(e.d)} · ${esc(e.t)}</li>`).join("")}</ul>`:""}
    </div></div>`);
    wire();
  }
  const base=JSON.stringify(d);
  // Al cerrar con cambios sin guardar, pregunta en vez de perderlos
  const dirty=()=>{read();return JSON.stringify(d)!==base};
  function wire(){
    beforeClose=async()=>{
      if(!dirty())return true;
      const c=await askChoice("¿Guardar los cambios?","<p>Has cambiado esta ficha y aún no lo has guardado.</p>",[{id:"keep",label:"Seguir editando",safe:true},{id:"drop",label:"Descartar cambios",kind:"danger"},{id:"save",label:"Guardar cambios",kind:""}]);
      if(c==="drop")return true;
      if(c==="save"){if(!d.company){toast("Falta la empresa");return false}commit();toast("Cambios guardados");return true}
      return false;
    };
    $("x").onclick=requestClose;
    $("save").onclick=()=>{read();if(!d.company){toast("Falta la empresa");return}commit();closeModal()};
    const del=$("del");
    if(del)del.onclick=()=>{closeModal();deleteEntry(orig)};
    const tb=$("toBoard");
    if(tb)tb.onclick=()=>{read();if(!d.company){toast("Falta la empresa");return}markApplied(d);commit();closeModal();toast("Pasada a Candidaturas como enviada")};
    const cp=$("copyMsg");
    if(cp)cp.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(d.analysis.message).then(()=>toast("Mensaje copiado")).catch(()=>toast("No se pudo copiar"))};
    const an=$("analyze");if(an)an.onclick=analyze; // solo existe dentro de Claude (fase 2 para el resto)
  }
  async function analyze(){
    read();
    if(!d.desc.trim()){toast("Pega primero la descripción de la oferta");return}
    const out=$("aiOut"),btn=$("analyze");
    const q=quickScore(d.desc);
    out.innerHTML=`<div class="note" style="margin-top:14px">Estimación rápida: ${q==null?"—":q+"%"}. El agente está analizando la oferta…</div>`;
    btn.disabled=true;
    try{
      const sample=await getSample();
      if(!sample)throw {code:"unavailable"};
      const prompt=`Eres un agente de búsqueda de empleo para un artista 3D del sector de los videojuegos. Analiza la oferta frente al perfil. Sé honesto y concreto; no inventes datos del candidato ni de la empresa.

PERFIL:
${profileText()}

${rulesText()}

OFERTA:
Empresa: ${d.company||"(sin indicar)"}
Puesto: ${d.role||"(sin indicar)"}
Ciudad: ${d.city||"(sin indicar)"} · País: ${d.country||"(sin indicar)"} · Modalidad: ${d.modality||"(sin indicar)"}
${d.desc}

Responde SOLO con JSON con esta forma exacta:
{"match": número 0-100 de compatibilidad aproximada,
 "summary": "2 frases sobre el encaje",
 "strengths": ["puntos fuertes concretos del perfil para esta oferta"],
 "gaps": ["requisitos que faltan o están flojos"],
 "recommendations": ["cambios concretos a hacer en CV, portfolio o carta para esta oferta"],
 "message": "mensaje de presentación listo para enviar (máx. 140 palabras, en el idioma de la oferta, tono profesional y cercano, sin inventar experiencia)"}`;
      const r=await sample.json(prompt,{modelTier:"default"});
      d.match=Math.max(0,Math.min(100,Math.round(Number(r.match)||q||0)));
      d.fit=fitFromMatch(d.match);
      d.analysis={summary:r.summary||"",strengths:r.strengths||[],gaps:r.gaps||[],recommendations:r.recommendations||[],message:r.message||"",at:todayISO()};
      d.events.push({d:todayISO(),t:`Análisis IA: ${d.match}% de compatibilidad`});
      draw();
      $("aiOut").insertAdjacentHTML("afterbegin",'<div class="note" style="margin-top:14px">Pulsa Guardar para conservar este análisis.</div>');
    }catch(e){
      const m=e&&e.code==="no_runtime"?"La IA solo funciona abriendo el panel desde el enlace publicado en Claude, no desde un archivo descargado.":e&&e.code==="not_granted"?"Has rechazado el permiso para usar Claude desde esta página.":e&&e.code==="rate_limited"?"Demasiadas peticiones seguidas; espera un momento.":"No se pudo completar el análisis con IA ahora mismo.";
      out.innerHTML=`<div class="note" style="margin-top:14px">${m} Estimación rápida por palabras clave: ${q==null?"no hay suficientes datos":q+"%"}.</div>`;
      btn.disabled=false;
    }
  }
  draw();
}
function analysisHtml(d){
  const x=d.analysis;
  const li=arr=>arr.length?`<ul class="clean">${arr.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`:'<p class="muted">—</p>';
  return `<div style="margin-top:16px">
    <div class="row" style="justify-content:space-between"><b>Encaje aproximado</b><span class="pill ${d.match==null?"":{probable:"ok",medio:"warn",poco:"bad"}[fitFromMatch(d.match)]}">${d.match==null?"—":d.match+"%"}</span></div>
    <div class="meter" style="margin:6px 0 10px"><i style="width:${d.match||0}%"></i></div>
    <p>${esc(x.summary)}</p>
    <h3 class="sect">Puntos fuertes</h3>${li(x.strengths)}
    <h3 class="sect">Lo que te falta</h3>${li(x.gaps)}
    <h3 class="sect">Qué cambiar para esta oferta</h3>${li(x.recommendations)}
    <h3 class="sect">Mensaje de propuesta</h3>
    <pre class="draft">${esc(x.message)}</pre>
    <button class="btn sec sm" id="copyMsg">Copiar mensaje</button>
  </div>`;
}

/* ===== Perfil ===== */
function renderProfile(){
  const p=S.profile;
  const chips=(arr,k)=>arr.map((s,i)=>`<span class="tag">${esc(s)}<button data-k="${k}" data-i="${i}" title="Quitar" aria-label="Quitar ${esc(s)}">${ic("x",13)}</button></span>`).join("");
  const addRow=(id,ph,k)=>`<div class="row" style="margin-top:8px"><input id="${id}" placeholder="${ph}" style="max-width:260px"><button class="btn sec sm" data-add="${k}" data-src="${id}">Añadir</button></div>`;
  $("t-profile").innerHTML=`<h2 class="ptitle">Mi perfil</h2>
  <p class="muted" style="margin:0 0 4px">Se usa para calcular el encaje de cada oferta y redactar los mensajes. Los cambios se guardan solos mientras escribes.</p>
  <section class="card pgroup"><h3 class="sect">Quién soy</h3>
    <div class="grid3">
      <div><label>Nombre</label><input data-f="name" value="${esc(p.name)}"></div>
      <div><label>Cómo quieres que te salude</label><input data-f="nick" value="${esc(p.nick||"")}"></div>
      <div><label>Ubicación</label><input data-f="location" value="${esc(p.location)}"></div>
    </div>
    <label>Titular</label><input data-f="headline" value="${esc(p.headline)}">
    <label>Portfolio (enlace)</label><input data-f="portfolio" value="${esc(p.portfolio)}" placeholder="https://artstation.com/...">
  </section>
  <section class="card pgroup"><h3 class="sect">Qué busco</h3>
    <div class="grid3"><div><label>Modalidad preferida</label><select data-f="modality">${["Híbrido","Presencial","Remoto","Cualquiera"].map(m=>`<option ${m===p.modality?"selected":""}>${m}</option>`).join("")}</select></div></div>
    <label>Roles objetivo</label><div>${chips(p.targetRoles,"targetRoles")}</div>${addRow("addRole","Añadir rol","targetRoles")}
    <label>Idiomas</label><div>${chips(p.langs,"langs")}</div>${addRow("addLang","Añadir idioma","langs")}
  </section>
  <section class="card pgroup"><h3 class="sect">Qué sé hacer</h3>
    <label>Skills y software</label><div>${chips(p.skills,"skills")}</div>${addRow("addSkill","Añadir skill","skills")}
  </section>
  <section class="card pgroup"><h3 class="sect">Trayectoria</h3>
    <label>Formación</label><textarea data-f="education">${esc(p.education)}</textarea>
    <label>Experiencia</label><textarea data-f="experience">${esc(p.experience)}</textarea>
  </section>
  <section class="card pgroup"><h3 class="sect">Notas para el agente</h3>
    <label>Preferencias, sueldo objetivo, lo que prefieres evitar…</label><textarea data-f="notes">${esc(p.notes)}</textarea>
  </section>`;
  const el=$("t-profile");
  // Guardado automático: espera a que dejes de escribir un momento para no guardar en cada letra
  el.querySelectorAll("[data-f]").forEach(i=>i.addEventListener("input",()=>{S.profile[i.dataset.f]=i.value;clearTimeout(profTimer);profTimer=setTimeout(()=>{save();renderHome()},700)}));
  el.querySelectorAll(".tag button").forEach(b=>b.onclick=()=>{
    const k=b.dataset.k,idx=+b.dataset.i,val=S.profile[k][idx];
    S.profile[k].splice(idx,1);save();renderProfile();
    toastUndo("«"+val+"» quitado",()=>{S.profile[k].splice(Math.min(idx,S.profile[k].length),0,val);save();renderProfile()});
  });
  el.querySelectorAll("[data-add]").forEach(b=>{
    const add=()=>{const inp=$(b.dataset.src),v=inp.value.trim();if(!v)return;S.profile[b.dataset.add].push(v);save();renderProfile();$(b.dataset.src).focus()};
    b.onclick=add;
    $(b.dataset.src).addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();add()}});
  });
}
let profTimer=null;

/* ===== Ajustes: GitHub y copia de seguridad ===== */
function renderSettings(){
  $("t-settings").innerHTML=`<h2 class="ptitle">Ajustes</h2>
  <p class="muted" style="margin:0 0 16px">Dónde se guardan tus datos, copia de seguridad y teclado.</p>
  <div class="card" id="ghCard"></div>
  <div class="card" style="margin-top:16px">
    <h3 class="sect">Teclado</h3>
    <label style="display:flex;gap:10px;align-items:center;font-size:14px;color:var(--ink);margin:0;cursor:pointer"><input type="checkbox" id="keysToggle" style="width:auto;accent-color:var(--accent)" ${keysOn()?"checked":""}> Atajos de una tecla en Inicio (S, A, E, J, K)</label>
    <p class="muted" style="font-size:13px;margin:6px 0 0">Desactívalos si usas dictado por voz o pulsas teclas sin querer. Las flechas, Intro, Ctrl+K y Ctrl+Z siguen funcionando.</p>
  </div>`;
  renderGhCard();
  $("keysToggle").onchange=e=>{try{localStorage.setItem(KEYS_KEY,e.target.checked?"on":"off")}catch(x){}renderHome();toast(e.target.checked?"Atajos activados":"Atajos desactivados")};
}

/* ===== Agente ===== */
function renderAgent(){
  // El chat solo funciona dentro de Claude; fuera queda oculto hasta la fase 2
  const chatCard=HAS_CL?`<div class="card">
      <h2 class="ptitle">Agente IA</h2>
      <p class="muted" style="margin-top:0">Habla con él para cambiar cómo analiza ofertas o redacta mensajes. Ej.: “Prioriza estudios con trabajo híbrido en Madrid”, “escribe los mensajes más breves”.</p>
      <div class="chat" id="chatBox">${chat.length?chat.map(m=>`<div class="msg ${m.r==="u"?"u":"a"}">${esc(m.t)}</div>`).join(""):'<div class="muted">Aún no hay conversación.</div>'}</div>
      <div class="row" style="margin-top:12px;flex-wrap:nowrap"><input id="chatIn" placeholder="Escribe al agente…"><button class="btn" id="chatSend">Enviar</button></div>
    </div>`:"";
  // Orden por uso: la búsqueda diaria primero; reglas (y chat, dentro de Claude) después
  $("t-agent").innerHTML=`${HAS_CL?"":'<h2 class="ptitle">Agente IA</h2><p class="muted" style="margin:0 0 16px">La búsqueda diaria de ofertas y las reglas del agente.</p>'}
  <div class="card" id="searchCard"></div>
  <div style="display:grid;grid-template-columns:${HAS_CL?"minmax(0,2fr) minmax(0,1fr)":"1fr"};gap:16px;align-items:start;margin-top:16px" id="agentGrid">
    ${chatCard}
    <div class="card">
      <h3 class="sect">Reglas activas del agente</h3>
      <p class="muted" style="font-size:13px;margin-top:0">${HAS_CL?"Se aplican en cada análisis y mensaje. Cuando le pidas un cambio de comportamiento estable, se añadirá aquí.":"Se aplicarán en cada análisis y mensaje cuando la IA funcione (fase 2). Puedes ir escribiéndolas ya."}</p>
      ${S.rules.length?`<ul class="clean">${S.rules.map((r,i)=>`<li>${esc(r)} <button class="btn sec sm" data-rm="${i}" title="Quitar regla" aria-label="Quitar regla">${ic("x",13)}</button></li>`).join("")}</ul>`:'<p class="muted">Sin reglas todavía.</p>'}
      <div class="row" style="margin-top:8px"><input id="ruleIn" placeholder="Añadir regla a mano"><button class="btn sec sm" id="ruleAdd">Añadir</button></div>
    </div>
  </div>`;
  if(window.innerWidth<800)$("agentGrid").style.gridTemplateColumns="1fr";
  renderSearchCard();
  if(HAS_CL){
    const box=$("chatBox");box.scrollTop=box.scrollHeight;
    $("chatSend").onclick=sendChat;
    $("chatIn").addEventListener("keydown",e=>{if(e.key==="Enter")sendChat()});
  }
  $("t-agent").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{S.rules.splice(+b.dataset.rm,1);save();renderAgent()});
  $("ruleAdd").onclick=()=>{const v=$("ruleIn").value.trim();if(!v)return;S.rules.push(v);save();renderAgent()};
}
async function sendChat(){
  if(busy)return;
  const inp=$("chatIn"),text=inp.value.trim();
  if(!text)return;
  busy=true;chat.push({r:"u",t:text});ss("chat",JSON.stringify(chat.slice(-30)));
  renderAgent();
  const b2=$("chatBox");
  b2.insertAdjacentHTML("beforeend",'<div class="msg a">Pensando…</div>');b2.scrollTop=b2.scrollHeight;
  let newRule=false;
  try{
    const sample=await getSample();
    if(!sample)throw {code:"unavailable"};
    let turns=chat.slice(-12).map(m=>({role:m.r==="u"?"user":"assistant",content:m.t}));
    while(turns.length&&turns[0].role!=="user")turns.shift();
    const c=counts();
    const instruction=`[Instrucciones para ti: eres el agente de búsqueda de empleo de un artista 3D de videojuegos, dentro de su panel personal. No puedes navegar por internet desde aquí. Puedes explicar cómo trabajas, aconsejar sobre candidaturas y cambiar tu comportamiento si el usuario lo pide. Responde en español, breve y útil.
PERFIL:\n${profileText()}\n${rulesText()}\nPÁGINAS DE BÚSQUEDA: ${agentText()}\nRESUMEN: ${c.sent} candidaturas enviadas, ${c.resp} respondidas, ${c.wait} sin contestar, ${c.rej} rechazadas.
Responde SOLO con JSON: {"reply":"tu respuesta","new_rules":["regla nueva si el usuario ha pedido un cambio estable de comportamiento; si no, lista vacía"]}]\n\n`;
    turns[0]={role:"user",content:instruction+turns[0].content};
    const r=await sample.json(turns,{modelTier:"default",cache:false});
    chat.push({r:"a",t:String(r.reply||"…")});
    (r.new_rules||[]).forEach(n=>{if(n&&!S.rules.includes(n)){S.rules.push(n);newRule=true}});
  }catch(e){
    chat.push({r:"a",t:e&&e.code==="no_runtime"?"La IA solo funciona abriendo el panel desde el enlace publicado en Claude, no desde un archivo descargado.":e&&e.code==="not_granted"?"Necesito que permitas usar Claude desde esta página para poder responder.":"No he podido responder ahora mismo. Inténtalo de nuevo en un momento."});
  }
  ss("chat",JSON.stringify(chat.slice(-30)));
  busy=false;renderAgent();
  if(newRule)save();
}

init();
loadDb();
initLocal();
</script></body></html>
